# Decisions this repository has already made, and the evidence for each.
#
# Compiled from code comments, commit messages, and the issue/PR record --
# specifically from what was *rejected*, which is where the reasoning usually
# lives. A rule earns a place here when someone proposed the opposite, it was
# considered on the merits, and the answer was no. Those are the decisions that
# get re-litigated by the next well-meaning contributor, or quietly undone by an
# agent rebasing patches at 3am.
#
# `browser/tests/native/test_tribal_rules.py` asserts every entry that is mechanically
# checkable. An entry with `check: manual` is documentation only.
#
# Adding one: cite the issue, PR, or commit. "I think this is how it works" is
# not evidence, and a rule nobody can trace gets deleted the first time it is
# inconvenient.

schema: 1

rules:
  # -------------------------------------------------------------------------
  # Virtual display
  # -------------------------------------------------------------------------

  - id: virtual-display-default-1x1x24
    title: The Xvfb default screen is 1x1x24 and stays that way
    check: automated
    evidence:
      - "PR #714 (rejected): 'use 1920x1080 screen size for virtual display'"
      - "PR #724 (rejected): the same change, proposed again"
      - "issue #458: blank screenshots, the reported motivation for both"
    rationale: >-
      Proposed twice, rejected twice, on two grounds. First, it does not fix
      anything: rendering was measured identical at both sizes -- innerWidth
      1280, innerHeight 984, fullpage 1280x5367 either way, with only
      fingerprint-rotation noise in the colour count. Second, it costs
      throughput: past 30-40 concurrent browsers the framebuffer becomes the
      bottleneck on a machine that handles 70-80 at 1x1. The root's size is
      not a fingerprint -- screen.* comes from the generated fingerprint,
      applied per context in the browser -- but a window lying outside the
      root is observable: X reports it fully obscured, and an occluded
      window's navigator.mediaDevices.enumerateDevices() never settles
      (measured 2026-11-03, window at the identity's 319,76 on the 1x1 root),
      and with no window manager it is never focused either (X focus follows
      the pointer, which a 1x1 root pins at 0,0). Firefox also sizes and
      places windows inside the X screen: on 1x1 a 400x300 window.open came
      up 120x54 at 0,0. So 1x1 holds only together with two patches:
      virtual-display-off-root-not-occluded.patch (no occlusion for a window
      outside the root; and with no window manager a new top-level window is
      focused at its first VisibilityNotify, as any desktop does)
      and virtual-display-claimed-screen.patch (an X screen smaller than the
      claimed one reports the claimed one). Guards: virtual-display-window-visible,
      popup-window-size, popup-covered-click,
      startup-size-hold-yields, all at this default.
    expect:
      module: camoufox.virtdisplay
      attribute: DEFAULT_SCREEN
      equals: "1x1x24"

  - id: virtual-display-size-override-exists
    title: The screen size is overridable, just not by default
    check: automated
    evidence:
      - "PR #714 review: 'hardcoding 1920x1080 would be the wrong default'"
    rationale: >-
      The rejection was of the *default*, not the capability. Anyone who needs a
      real framebuffer sets CAMOUFOX_VIRTUAL_DISPLAY_SIZE. Removing the hatch
      would turn a settled disagreement back into an open one.
    expect:
      module: camoufox.virtdisplay
      attribute: SCREEN_ENV_VAR
      equals: CAMOUFOX_VIRTUAL_DISPLAY_SIZE

  - id: composite-extension-off
    title: The X Composite extension stays disabled by default
    check: automated
    evidence:
      - "issue #93: no video under headless='virtual'"
      - "python/src/camoufox/virtdisplay.py: the measurement table"
    rationale: >-
      Briefly enabled on the theory that disabling it caused #93. It did not --
      #93 was a Juggler bug, fixed by capturing the screencast from the
      compositor instead of libwebrtc's X11 window capturer. Measured at the
      time: Composite on + record_video_dir crashed the browser with SIGSEGV
      inside the X11 capturer. That capturer is gone, so enabling it is no
      longer dangerous, but it is no longer useful either. Off is the
      long-standing default and there is now no reason to move.
    expect:
      module: camoufox.virtdisplay
      attribute: COMPOSITE_ENV_VAR
      equals: CAMOUFOX_VIRTUAL_DISPLAY_COMPOSITE

  - id: displayfd-not-lockfile-scan
    title: Displays are claimed atomically with -displayfd, by Xvfb and by Xorg
    check: automated
    evidence:
      - "issue #597 / commit 8f9ff07"
      - "2026-10-12, Ubuntu's setuid Xorg.wrap: `Xorg -displayfd N -config <name> ...` run unprivileged wrote its display number (:6, past live and stale sockets) down the pipe once the server was up"
    rationale: >-
      The old userspace lock-file scan plus random-jitter retry raced: many
      camoufox processes starting at once all saw the same free display numbers
      before any of them bound. -displayfd lets the server scan up from :0 and
      bind the first free socket itself -- kernel-mediated, no userspace race --
      then writes the number back down an inherited pipe. The GPU display's
      Xorg takes it through the setuid wrapper too, so it does not use the
      random display number and lock-file wait it was ported from.
    expect:
      module: camoufox.virtdisplay
      xvfb_args_contain: "-displayfd"

  - id: displayfd-read-timeout
    title: The displayfd read is bounded
    check: automated
    evidence:
      - "commit 8f9ff07: 'so a hung Xvfb fails fast instead of blocking forever'"
    rationale: >-
      A hung Xvfb with no timeout blocks the launch forever, at 0% CPU, with no
      diagnostic. Thirty seconds is the bound: a cold first Xvfb on a fresh
      host took up to 8.4 s to report, so ten failed launches that would have
      succeeded.
    expect:
      module: camoufox.virtdisplay
      attribute: DISPLAYFD_READ_TIMEOUT_S
      is_positive_number: true

  - id: xvfb-cleanup-runs-even-if-it-already-died
    title: The display's lock and socket are removed whether or not we killed it
    check: automated
    evidence:
      - "found by browser/tests/native/test_crash_recovery.py::test_xvfb_sigkill_under_a_virtual_display"
      - "isolated: Xvfb alive -> socket removed; Xvfb already dead -> socket leaked"
    rationale: >-
      kill() used to gate its entire body on `self.proc.poll() is None`, so a
      display whose Xvfb had already died -- crashed, OOM-killed, reaped with
      the browser's process group -- was never cleaned up. That is backwards: a
      SIGKILLed Xvfb never removes its own socket, so the crash path is the only
      one where /tmp/.X11-unix/X<n> survives, and it was the one path kill()
      skipped. Stranded sockets accumulate, and -displayfd scans upward for a
      free number, so each one pushes the next display higher until a
      long-running host stops being able to allocate one at all.

  - id: xvfb-sigkill-and-socket-cleanup
    title: Xvfb is SIGKILLed, reaped, and its X11 lock and socket removed
    check: automated
    evidence:
      - "PR #652 / commit 71fe028"
      - "PR #618 / commit ce5edf6: wait() the child or it becomes a zombie"
    rationale: >-
      The old terminate-wait-kill ladder left zombie Xvfb processes, and the
      stale /tmp/.X{n}-lock and /tmp/.X11-unix/X{n} files it left behind blocked
      later display allocation. Both halves matter: SIGKILL then wait() so
      nothing is reaped later, then unlink both files.

  - id: xvfb-dies-with-its-launcher
    title: Xvfb gets a parent-death signal, so it never outlives its launcher
    check: automated
    evidence:
      - "issue #868: 113 orphaned Xvfb processes after SIGTERMed launchers"
      - "browser/tests/native/test_crash_recovery.py::test_launcher_sigkill_leaves_nothing_on_its_display"
      - "dbus-launch(1): --autolaunch implies --exit-with-session, whose babysitter kills the bus when it loses its X connection"
    rationale: >-
      kill() runs on the close path, which a launcher killed by a signal never
      reaches, and start_new_session keeps Xvfb out of a process-group kill. So
      Xvfb is exec'd through `setpriv --pdeathsig TERM`: the kernel signals it
      when its launcher dies, even by SIGKILL, and SIGTERM lets Xvfb remove its
      own lock and socket. The session bus Firefox autolaunches on that display
      dies with the X connection, taking its helpers with it. setpriv rather
      than prctl in a preexec_fn: it is the same in both packages, and
      preexec_fn is unsafe in a threaded parent. The signal fires when the
      thread that spawned Xvfb exits, which is the thread that owns the browser.
  - id: gpu-display-shares-the-vt
    title: The GPU display's Xorg always runs with -sharevts and -novtswitch
    check: automated
    evidence:
      - "Holo's headless='virtual-gpu' (the port's source): without -sharevts Xorg took a new VT and moved the monitor to the offscreen server, blanking the live desktop"
      - "2026-10-12: with both flags, Xorg on the RTX 5080 and on the RX 7900 XTX left the active VT on tty2 throughout"
    rationale: >-
      A headless Xorg that allocates its own VT switches the console to it, and
      the user's desktop goes black. -sharevts shares the current VT instead,
      and -novtswitch blocks the switch at start and exit; the config adds
      DontVTSwitch, and UseDisplayDevice "None" on NVIDIA. The launcher also
      watches /sys/class/tty/tty0/active while the server starts and, if it
      moves, switches back, kills the server and raises GpuVtTakeover. That
      guard is insurance, not a reason to drop either flag.
    expect:
      module: camoufox.gpudisplay
      attribute: SERVER_FLAGS
      contains: ["-sharevts", "-novtswitch"]

  - id: gpu-display-terminates-with-its-last-client
    title: The GPU display's Xorg runs with -terminate, never -noreset, and the launcher holds one client
    check: automated
    evidence:
      - "Holo: with -noreset, root-owned servers outlived their launchers and used up VRAM; a server no client ever reached never terminates, and 20 such servers once held ~1 GB of RSS on one machine"
      - "2026-10-12: an Xorg started through Xorg.wrap exited on its own about 2s after a raw X11 client connected and disconnected"
    rationale: >-
      Through the setuid wrapper Xorg runs as root, and a launcher killed with
      SIGKILL runs no teardown at all, so the server must end itself.
      -terminate exits it after its last client disconnects; -noreset keeps it
      forever. A server no client reached has no last client, so the launcher
      connects one raw X11 client as soon as the display is up and holds it
      for the display's lifetime: closed by kill(), or by the kernel when the
      launcher dies.
    expect:
      module: camoufox.gpudisplay
      attribute: SERVER_FLAGS
      contains: ["-terminate"]
      excludes: ["-noreset"]

  - id: gpu-display-sigterm-before-sigkill
    title: The GPU display's Xorg is asked to exit before it is killed
    check: manual   # browser/tests/native/test_gpu_display.py
    evidence:
      - "2026-10-12: a SIGKILLed Xorg left a root-owned /tmp/.X11-unix/X6 that the unprivileged launcher could not remove"
    rationale: >-
      Unlike Xvfb (xvfb-sigkill-and-socket-cleanup), the GPU display's server
      is root's, so its socket is too, and only the server can remove it.
      kill() drops the held client, sweeps the processes on the display, sends
      SIGTERM and waits; SIGKILL is the last resort for a server that did not
      exit.

  - id: gpu-selected-by-pci-address
    title: The GPU is named by the caller and bound by PCI address, never by render node number
    check: automated
    evidence:
      - "2026-10-12, this machine: renderD128 is the RX 7900 XTX, though a config generated earlier on it recorded renderD128 as the RTX 5080"
      - "Holo: NVIDIA and AMD renders of the same scenes differed on 31 of 42 and on MAX_VERTEX_UNIFORM_VECTORS"
    rationale: >-
      Render nodes are numbered in the order the drivers loaded, which changes
      between boots. The PCI address does not, so the GPUs are listed in PCI
      address order, the config binds the card with its BusID and is named
      after its address, and the selector accepts an address. Several GPUs
      with no selector is an error, not a guess: the identity claims the GPU
      that renders, so the card must be the one the caller meant.

  - id: gpu-use-is-read-from-the-kernel
    title: The GPU display proves rendering by the GPU the kernel accounts, not the renderer string or an open render node
    check: automated
    evidence:
      - "2026-10-12, v156.0.1-beta.32: forced onto Mesa's software path on the RTX 5080, Firefox still held /dev/dri/renderD129 (for DMABuf) and not /dev/nvidia0; on hardware it held /dev/nvidia0"
      - "2026-10-12: on the RX 7900 XTX, Firefox's render node showed drm-engine-gfx growing on hardware and was not opened in software"
    rationale: >-
      The renderer string is what the identity claims, so it proves nothing.
      An open render node proves nothing either: Firefox opens the card's DRM
      nodes for DMABuf whatever renders. The check is the NVIDIA driver's
      /dev/nvidia<minor> held open, or time on a GPU engine in the render
      node's fdinfo (the kernel's DRM usage stats), while a probe page draws.
      A browser that fails it is closed and the launch raises
      GpuSoftwareFallback; there is no fallback to Xvfb.

  # -------------------------------------------------------------------------
  # Dependencies
  # -------------------------------------------------------------------------

  - id: no-third-party-camoufox-distribution
    title: Nothing here depends on someone else's camoufox package
    check: automated
    evidence:
      - "PR #521 (2026-03-15) added `cloverlabs-camoufox` to build-tester/requirements.txt"
      - "the commit's author is the PyPI author of that package"
      - "browser/tests/build-tester/scripts/presets.py already prints the correct answer in its ImportError handler"
    rationale: >-
      build-tester generates its fingerprints with camoufox.fingerprints, so
      whichever distribution provides `camoufox` decides what is actually being
      tested. Pointing that at a third-party redistribution means the binary is
      graded against someone else's fingerprint generation, a divergence between
      the two reads as a browser bug, and every CI run pulls an outside package
      into a job holding repository credentials. The only `camoufox` this
      repository may install is python/ from this tree.
    expect:
      no_dependency_matching: "camoufox"
      except_paths: ["python/pyproject.toml"]
      allowed_forms: ["-e ../../../python", "-e ./python", "-e python"]

  - id: ubo-release-pinned
    title: The bundled uBlock Origin is a committed pin, never AMO's newest
    check: manual   # ci/tests/test_fetch_ubo.py, browser/tests/playwright/patches/main-world-eval-globals.py
    evidence:
      - "2026-11-09: uBO 1.76.0 (AMO's newest mid-sync) put RegExp after URL in the global order of every tab after the first; stock 158, no uBO and uBO 1.75.4 keep it after Number in every tab and window"
    rationale: >-
      uBO runs in every page, so a uBO release can change what a page observes.
      fetch-ubo.py resolve reads browser/scripts/data/ubo.json; `newest` prints
      AMO's latest as a candidate. A bump is a commit, made after the stock
      parity and automation guards pass with it.

  # -------------------------------------------------------------------------
  # Measurement
  # -------------------------------------------------------------------------

  - id: animations-run-on-stock-timing
    title: Animations run on stock timing unless the caller opts into instantAnimations
    check: automated
    evidence:
      - "measured on v152.0.4-beta.31: el.animate(frames, 1000).effect.getComputedTiming().duration returned 0, a 500ms transition 0"
      - "the finished promise still resolved after ~1000ms, so the only saving was Playwright's stability wait"
    rationale: >-
      Instant animations were the default so Playwright never waited on one,
      but any page reads the zero duration back in one line. Reporting the
      real duration while not rendering the animation does not hide it
      either: getComputedStyle or getBoundingClientRect sampled mid-animation
      returns the end state. So the saving costs stealth, and it is the
      caller's choice: `instantAnimations: True` turns it on and warns.

  - id: spoofed-voices-speak
    title: speak() on a spoofed voice starts, then ends after the text's duration
    check: automated
    evidence:
      - "measured on v152.0.4-beta.31: speak() on a spoofed voice fired `error` after 3ms"
      - "voices:fakeCompletion, the opt-out, fired start and end in the same tick"
    rationale: >-
      A spoofed voice has no engine behind it, and a real voice never errors
      on a plain utterance or ends the instant it starts. So the browser
      speaks it silently for as long as the text takes at ~150 words per
      minute. The two config keys that chose between the two tells are gone.

  - id: driven-pages-stay-focused
    title: A driven page stays focused and active, deliberately not stock
    check: manual   # browser/tests/playwright/patches/driven-page-real-focus.py
    evidence:
      - "product decision, 2026-11-05: every page a caller opens must keep running as if a person is looking at it"
      - "the stock-focus change in daijro/camoufox#997 made background pages lose focus and visibility; it is reverted here"
    rationale: >-
      Stock Firefox gives a page behind another window hasFocus() false, a
      window blur, and a hidden, throttled state behind a foreground tab. A
      driver's pages are all work the caller asked for, in parallel, so
      Camoufox keeps every top-level driven document focused and active
      (docShell.overrideHasFocus / forceActiveState). This is page-visible: it
      is a product choice, not a parity bug.

  - id: no-made-up-srflx
    title: A srflx candidate comes only from a STUN answer
    check: manual   # browser/tests/playwright/patches/webrtc-context-ip.py, webrtc-socks5-udp.py
    evidence:
      - "daijro/camoufox#997: the fabricated srflx is removed, and its guards now run against a STUN server that answers"
      - "webrtc-socks5-udp.py: gathering behind a proxy with no UDP takes as long as against a STUN server that never answers"
    rationale: >-
      A srflx says the page's STUN server saw a Binding Request from that
      address, and a page running its own server can tell it never did. Behind
      a proxy with no UDP path, the page reads a machine whose UDP is blocked:
      host candidates only, obfuscated even with capture permission, and
      datagrams dropped silently so gathering times out as it does on a
      firewalled machine. The identity's address replaces a srflx the browser
      really gathered; it never invents one.

  - id: juggler-records-the-proxy
    title: Juggler records which contexts are proxied, not the launcher and not the page
    check: manual   # browser/tests/playwright/patches/webrtc-socks5-udp.py (blob:, about:blank, launch proxy), webrtc-proxy-no-udp-around.py (bypass, system proxy)
    evidence:
      - "daijro/camoufox#997, CI run 42147151481: a raw browser.new_context(proxy=...) gathered around its SOCKS5 proxy on a blob: page"
    rationale: >-
      A document with no HTTP channel has no proxy lookup to go by, so WebRTC
      needs another answer. Every proxy reaches Juggler, however the caller
      set it, and Juggler's flag is a default-branch pref a page cannot see. A
      launcher config key misses a caller's own new_context, and a window
      method is one more name a page can find. A system proxy is recorded at
      startup, and a page in its proxy's bypass list counts as proxied: it
      gets no UDP or ICE TCP, because this machine is not the identity's.

  - id: no-glyph-spacing-noise
    title: Text is shaped exactly as stock Firefox shapes it; there is no spacing seed
    check: automated
    evidence:
      - "#779 (6daae88): measured +1 px per ~100 glyphs and fractional deltas on every measureText; defaulted the seed to 0"
      - "issue #741 / ad697a8: the perturbation detached combining marks in Thai, Lao, Arabic, Devanagari and Hebrew"
    rationale: >-
      The feature added a seeded amount to every glyph advance so that text
      widths differed per context. No real machine produces those widths:
      the same font on the same OS measures the same everywhere, so a width
      that matches no real installation is a fingerprint, not a disguise. It
      was defaulted off in #779 and kept as an opt-in, but an opt-in whose
      only effect is to become detectable is not a feature, so the manager,
      the window setter, the shaper hook and the config key are gone.

  - id: canvas-is-not-noised
    title: The canvas is rendered, not noised, and there is no canvas seed
    check: automated
    evidence:
      - "PR #528 (e4528a2): 'Disable Canvas Noise' -- removed the canvas noise patch"
      - "issue #721: canvas:seed declared and passed through, but nothing consumed it"
      - "24 profiles across 3 runs on v152.0.4-beta.30: canvas 16 distinct of 24, audio 24 of 24"
      - "toolkit/components/resistfingerprinting/RFPTargetsDefaultBaseline.inc: EfficientCanvasRandomization is on by default in every window"
      - "v156.0.1-beta.32: two contexts, identical getImageData, PNG data URLs differing only by a deBG chunk"
    rationale: >-
      Stock Firefox does not perturb canvas pixels, so noise is itself a tell:
      a page that renders the same image twice and gets two answers has found
      a spoofing browser. What stock Firefox does do, through baseline
      fingerprinting protection, is append a per-session deBG chunk to PNGs
      from toDataURL and toBlob; Camoufox leaves that on, as Firefox ships it. A context's canvas therefore follows what really
      determines it on a real machine, the GPU and the fonts, and two contexts
      that share those share a canvas. That is why build-tester counts canvas
      collisions with the device-level values and does not gate on them. The
      launchers generated a canvas:seed for three releases after the patch
      that read it was gone; it is not generated or declared any more. The one
      exception is an identity on another OS or GPU than the host's, whose
      canvas cannot agree with it (cross-os-canvas-is-the-rfp-placeholder).

  - id: audio-is-not-noised
    title: The audio render is stock Firefox's, one value per CPU architecture, and there is no audio seed
    check: automated
    evidence:
      - "issue #926 / PR #927. Study 2026-10-23: 106 runs of stock Firefox, probe = fingerprintjs (OfflineAudioContext 1x5000@44100, triangle 10 kHz into a compressor, sum of |samples| 4500..5000, and SHA-256 of the whole buffer), CreepJS AnalyserNode frequency/time-domain reads, a biquad lowpass and a plain sine. Data: audio-study/summary_all.txt and audio-study/results/ (kept outside the repo); the guard browser/tests/playwright/patches/audio-matches-stock.py carries the probe and the expected values"
      - "ARM64, all 45 runs FPJS 35.74996626004577, buffer sha 8e127fb8b39c...: Raspberry Pi 4 Model B (Cortex-A72, ARMv8.0, Debian 12 arm64), Firefox 158.0.1 and 152.0.3, headless and headed; Mac Studio, Apple M5 Ultra, macOS 27.0.1; Mac mini, Apple M4, macOS 27.0; GitHub macos-14/15/26 (Apple M1), ubuntu-24.04-arm (Neoverse-N2), windows-11-arm (Cobalt 100/200)"
      - "x86-64, all 61 runs FPJS 35.749972093850374, buffer sha dea0ebd60642...: Ryzen 7 9850X3D (Zen 5, AVX-512), Ubuntu 26.04, Firefox 152.0.3, 153.0, 156.0.1 and 158.0.1; i9-11900H, Windows 11 26200, Firefox 158.0.1 and 152.0.3; GitHub ubuntu-latest/22.04 on EPYC 7763 (Zen 3, AVX2) and 9V45/9V74 (AVX-512); GitHub windows-latest/2022 on EPYC; GitHub macos-15-intel on i7-8700B"
      - "every run of an architecture also gave the same AnalyserNode, biquad and sine hashes; Linux, macOS and Windows on one architecture agree, and so do Firefox 152 to 158"
      - "device swap on the Ryzen box: EDIFIER R19BT USB, Samson Q2U, Radeon HDMI, null sinks at 6ch/96k and 1ch/22.05k, private PipeWire servers at 22050, 44100, 48000 and 96000 Hz, and no audio server all gave bit-identical offline output; only sampleRate, maxChannelCount and outputLatency followed the device"
      - "fpgen audio_hash_by_platform (Firefox records, its own metric): the x86 value is about 74% of records, and macOS records carry the ARM value"
      - "Camoufox's per-identity noise gave 35.734-35.743, which no real Firefox produced; v158.0-beta.40 with audio:seed 424242 renders 35.74635897387998 and moves the AnalyserNode, biquad and sine hashes too, and with audio:seed 0 renders stock x86-64 to the bit (audio-matches-stock.py)"
    rationale: >-
      An OfflineAudioContext render depends on the CPU's floating-point path and
      nothing else a page can see: not the OS, the sound card, the sample rate
      or the Firefox version. Real Firefox therefore has one audio fingerprint
      per architecture, and a site that has seen a few million visitors knows
      both. Noise did not hide the device; it put every identity on a value no
      real machine produces, and gave each context of one browser a different
      one, which no real browser does either. The render is left as stock
      renders it, so it is the host's architecture's value, the same in every
      context and every launch, and a returning identity reproduces it
      trivially (#442, #765). The audio-fingerprint-manager patch, its
      per-context setter and the audio:seed key are gone; a caller passing
      audio:seed gets a warning that it was removed, and the key is dropped
      before it reaches the browser. build-tester counts
      the audio hash with the values that must match across contexts, and the
      audio-matches-stock guard checks the build against the recorded values.

  - id: canvas-follows-the-claimed-cpu-vendor
    title: A page computes as the claimed CPU does, Intel, AMD or ARM64; the x86 vendor is drawn at Firefox's x86 share
    check: manual   # ci/tests/test_cpu_estimates.py, browser/tests/cpu-estimates/check.py, guard cpu-vendor-estimates
    evidence:
      - "2026-11-10, all 2^32 inputs: Core i7-12700H (Linux) and i9-11900H (Windows 11) give identical RCPPS/RSQRTPS bits; Ryzen 7 9850X3D (Zen 5) and Threadripper 7970X (Zen 4) give identical bits; the two vendors differ (browser/tests/cpu-estimates/provenance.json)"
      - "stock Firefox 159.0, gradient over gradient, getImageData FNV-1a: i9-11900H on Windows and Ryzen 9850X3D on Linux agree for source-over, multiply, screen and soft-light and differ for color-dodge, color-burn, hue, saturation, color and luminosity; the build with general.cpu_identity 1 on the Ryzen gives the i9's hashes for all ten (guard cpu-vendor-estimates)"
      - "stock Firefox 159.0, WebCodecs AudioEncoder Opus 64 kbit/s mono, one second of a fixed signal: one byte stream on the i7-12700H (Linux) and i9-11900H (Windows), another on the Ryzen 9850X3D (Linux) and the Threadripper 7970X (Firefox 158, Linux); libopus celt/x86/vq_sse2.c calls _mm_rcp_ps and _mm_rsqrt_ps; the build with general.cpu_identity 1 on the Ryzen gives the Intel stream byte for byte (guard cpu-vendor-estimates)"
      - "stock Firefox 159.0 on the same four x86 CPUs: Web Audio nodes, NaN bits, the 11 WebAssembly relaxed SIMD operations, WebGL shaders, flac/vorbis/AAC and the video encoders gave one value per OS, none per vendor; an Apple M4 differs in all of Web Audio, nearly all canvas operations, Opus, NaN sign and 9 relaxed SIMD operations"
      - "2026-11-11, the build with general.cpu_identity 3 on the Ryzen 9850X3D, launched through the Python launcher under Xvfb: all 45 cpu-probe keys on which stock 159.0 x86-64 and ARM64 Linux differ (canvas text aside, which follows devicePixelRatio) equal the Apple M4 container's (guard cpu-vendor-estimates)"
      - "2026-11-11, the aarch64 build on an Apple M4 (Debian container, Xvfb, 8 cores), launched through the Python launcher: cpu intel and amd each give stock's ten composite hashes and Opus stream, and all 46 cpu-probe keys on which stock 159.0 x86-64 and ARM64 Linux differ equal the i7-12700H's and the Ryzen 9850X3D's (guard cpu-vendor-estimates)"
      - "Firefox Public Data Report, hardware, week of 2026-11-02: Intel 76.86%, AMD 17.61%, Apple 5.04%, so Intel is 81.4% of x86; no per-OS split is published"
    rationale: >-
      The two estimate instructions are specified only to a relative error, and
      each vendor implements them with its own table, the same across that
      vendor's generations and OSes. Skia's raster pipeline uses them for
      blend modes, perspective and matrix inversion, and libopus for the PVQ
      search in its encoder, so canvas readback and encoded Opus name the
      host's vendor. The patch reproduces the other vendor's table when the
      pref names it and changes nothing otherwise; libgkcodecs cannot read
      prefs, so Gecko hands libopus the table before creating an encoder. The launcher draws the vendor
      with the identity: from the GPU where only one vendor's CPU carries it
      (Intel integrated graphics, Radeon APU graphics, every x86 Mac), else at
      Firefox's x86 share, which Steam's survey would put far lower for Intel.
      Audio is not part of the vendor split: the offline render splits x86-64
      from ARM64, not Intel from AMD (audio-is-not-noised). An ARM64 identity
      on x86-64 runs Firefox's aarch64 code paths emulated in C (Skia, Web
      Audio, ffvpx, libopus) and ARM's NaN and relaxed SIMD rules in the JIT;
      an Intel or AMD identity on ARM64 runs the x86 paths the same way (SSE,
      AVX2 and FMA intrinsics in C, ffvpx's x86 assembly translated by
      x86toc.py) and x86's NaN and relaxed SIMD rules.

  - id: cross-os-canvas-is-the-rfp-placeholder
    title: On the host's OS the identity claims the host's GPU or software renderer; on another OS or GPU canvas readback is RFP's random placeholder
    check: automated
    evidence:
      - "v156.0.1-beta.32, 2026-10-06: getImageData and readPixels identical with privacy.fingerprintingProtection on and off; CanvasUtils.cpp checks EfficientCanvasRandomization (PNG deBG chunk only) before CanvasRandomization"
      - "LibreWolf librewolf.cfg: privacy.resistFingerprinting true, no canvas prefs of its own; RFP readback without permission is TryToGenerateRandomDataForPlaceholderCanvasData"
      - "v156.0.1-beta.32: the three RFP canvas targets in privacy.baselineFingerprintingProtection.overrides give RFP's readback (random, toDataURL ~770 bytes) with hardwareConcurrency untouched"
      - "v156.0.1-beta.32: a Linux host with an RTX 5080 and a Ryzen iGPU reported 'AMD, Radeon HD 3200 Graphics, or similar' to WebGL, headless and headed"
      - "v156.0.1-beta.32: a Linux identity whose config claimed availHeight 1053 on a 1080 screen read 1080 (nsRFPService::GetSpoofedScreenAvailSize, no Linux offset)"
      - "Stock 159.0 on Linux with an RX 7900 XTX under Xorg: WebGL reads 'Radeon R9 200 Series, or similar' on the working driver; with MESA_LOADER_DRIVER_OVERRIDE=bogus or LIBGL_ALWAYS_SOFTWARE=1 it reads 'llvmpipe, or similar' from Mesa, with the same readPixels hash as Xvfb. A private window on Xvfb gives that hash too. Broken NVIDIA and blocklisted drivers were not tried"
      - "dom/canvas/WebGLContext.cpp, Firefox 159: UNMASKED_RENDERER_WEBGL is gl->fGetString(LOCAL_GL_RENDERER) on the context that draws the pixels, unless webgl.override-unmasked-renderer is set (empty by default)"
      - "Stock 159.0 with privacy.resistFingerprinting reports the renderer 'Mozilla', and LibreWolf ships that pref on, so a GPU name over random readback is not what LibreWolf shows either"
    rationale: >-
      Canvas and WebGL pixels come from the host's OS, driver and GPU. On the
      host's OS the identity claims the GPU Firefox reports there, read from the
      browser itself because Firefox may render on another device than system
      tools name and sanitizes the name its own way. A software renderer is
      claimed like a GPU: Firefox reads the name and the pixels from one GL
      context, so a GPU name over software pixels never happens on a real
      machine, and a machine with a broken GPU driver reports llvmpipe too. It
      reads as a server, which is better than a contradiction. On another OS,
      or with another GPU (one the caller or a preset names, or a host GPU
      fpgen never recorded, which has no WebGL data to claim), nothing can
      agree, and Firefox 156's private windows do not hide pixels, so the
      launchers turn on privacy.resistFingerprinting's canvas targets through
      the baseline overrides and nothing else. One function in each launcher
      (plan_rendering, planRendering) makes that decision for the launch and
      for the host identity its contexts must keep; a covered browser binds
      no context to the host. The readback is then
      what LibreWolf, Tor Browser and Mullvad Browser return; stock Firefox
      does not, so the launch warns. Firefox's older keyed pixel noise
      (CanvasRandomization) was rejected: no current Firefox produces it by
      default. Spoofed avail-screen and touch values go through baseline
      protection like the real ones, for the claimed OS, so the launchers
      claim them as it reports them (follow_baseline_protection,
      followBaselineProtection): the available screen is the screen less 48px
      on Windows, 76px on macOS and nothing on Linux, and more than one touch
      point is 5. A config claiming fpgen's recorded values read differently
      on the page.

  - id: webgpu-follows-the-claimed-device
    title: navigator.gpu where Firefox on the claimed device has it; the host's adapter only behind the host's own GPU
    check: automated
    evidence:
      - "StaticPrefList.yaml (156.0.1): dom.webgpu.enabled is true on XP_WIN and on aarch64 XP_MACOSX, early-beta only elsewhere"
      - "fpgen gpuInfo, Firefox: navigator.gpu with no adapter on Windows on the Microsoft Basic Render Driver; no navigator.gpu on Intel and AMD Macs; no navigator.gpu for 97% of Linux"
      - "dom/webgpu/Adapter.h: GPUAdapterInfo vendor, architecture, device and description are always empty; limits and features are the real adapter's"
      - "v156.0.1-beta.32, Linux, prefs at startup: gfx.blacklist.webgpu 1 gives a real adapter, 4 (FEATURE_BLOCKED_DEVICE) resolves requestAdapter() to null"
      - "the same prefs through Playwright's firefox_user_prefs alone arrive after gfxPlatform::InitWebGPUConfig and are ignored"
    rationale: >-
      WebGPU hands the page the host's adapter: its limits and features name
      the real GPU even though Firefox blanks the adapter strings. Exposure
      follows Firefox's own build rule for the claimed device, so a Linux or
      Intel Mac identity has no navigator.gpu and a Windows or Apple Silicon one
      does. The adapter is the host's only when the identity claims the host's
      hardware GPU; otherwise the launchers set the downloadable blocklist's
      pref to a blocked device, and requestAdapter() resolves to null as it
      does for real users on a blocked or software GPU. The pref is read once at
      startup, so it goes through CAMOU_PREFS. It is written either way,
      because a persistent profile saves it and the next startup reads it.

  - id: webgl-browser-owned-values-follow-firefox
    title: WebGL values the browser decides follow the running Firefox and the claimed OS's backend, not fpgen's recording
    check: automated
    evidence:
      - "fpgen model-2/2026 records Firefox 146 (90% of Windows, 89% of macOS, 66% of Linux user agents); Camoufox ships 156.0.1"
      - "stock 146.0 and 156.0.1 on the same machines, twice each: Windows 11 on Intel Iris Xe and RTX 3050 Ti (headed), M1 Pro (headed), Linux on a Ryzen iGPU (headless); fpgen's records match 146 on the same hardware"
      - "Windows: 156 exposes EXT_depth_clamp in WebGL1 and WebGL2 on both GPUs, 146 on neither, and no fpgen Windows record has it. third_party/angle/src/libANGLE/renderer/d3d/d3d11/renderer11_utils.cpp:1334 (156, ANGLE chromium/7778) sets depthClampEXT = true on every D3D11 feature level; 146's ANGLE (chromium/5359) never sets it"
      - "Linux: WebGL1 ALIASED_LINE_WIDTH_RANGE is [1, 2048] on 146 and [1, 1] on 156, WebGL2 [1, 1] on both. 146's dom/canvas/WebGLContext.cpp:324 forced REQUIRE_COMPAT_PROFILE on WebGL1 unless webgl.1.allow-core-profiles, which 146's StaticPrefList.yaml set on macOS only; 156 removed both, and WebGLContextValidate.cpp:211 reads the driver's range only off a core profile, leaving WebGLTypes.h:654's {1, 1}"
      - "fpgen Linux WebGL2 records: [1, 1] on 97%, the driver's range on the 3% without EXT_depth_clamp (GLES drivers, where Firefox reads it)"
      - "fpgen Linux records for the GeForce GTX 480 and 980 also differ in WebGL1 and WebGL2 ALIASED_POINT_SIZE_RANGE, a 146 compatibility-profile value; CreepJS flags any mirrored non-string WebGL1/WebGL2 parameter that differs"
      - "browser/tests/playwright/patches/stock-gpu-parity.py fails on the 146-style WebGL1 range on Linux, on a hardware GPU and on llvmpipe, and passes with the fix"
      - "Firefox 159 (bug 1735401) exposes EXT_texture_norm16 on WebGL2, no longer behind webgl.enable-draft-extensions: stock 159.0 on M1 (headless) and on Linux llvmpipe (Xvfb) list it on WebGL2 and not WebGL1; stock 158.0.1 on the same Linux and 146.0 on the same M1 list it on neither. dom/canvas/WebGLExtensions.cpp's IsSupported needs GLFeature::texture_norm16, core in desktop GL 3.1"
      - "Firefox 159 caps WebGL2 MAX_UNIFORM_BLOCK_SIZE at 64 KiB (WebGL2ContextState.cpp, kMaxUniformBlockSize): on one Linux AMD machine, stock 146 reports 4294967292 and stock 159.0 65536, and stock-gpu-parity.py failed on the recording's 4120744960 until the launchers applied the cap"
      - "Firefox 159 adds EXT_clip_control (GLFeature::clip_control, GL 4.5) and EXT_texture_mirror_clamp_to_edge (GL 4.4) to WebGL1 and WebGL2: stock 159.0 on Linux llvmpipe, x86_64 and aarch64, lists both where 158.0.1 lists neither, and stock 159.0 on M1 lists neither. 159's third_party/angle renderer11_utils.cpp sets textureMirrorClampToEdgeEXT on every D3D11 device and clipControlEXT from feature level 10_0"
    rationale: >-
      fpgen's records are right for the Firefox that made them; what goes
      stale is what that Firefox decided rather than the GPU. Hardware-owned
      values (the renderer, most limits, the extensions a Linux or macOS
      driver offers) keep coming from the recording. Browser-owned ones are
      corrected where the launchers convert a recording (to_config). ANGLE's
      D3D11 backend gives every Windows GPU EXT_depth_clamp, which takes its
      place in Firefox's alphabetical extension order. WebGL1 now shares
      WebGL2's GL profile, so it reports the value the same device recorded
      for WebGL2 for every parameter both contexts report (the line width
      range, the point size range...), which is right for core profiles and
      GLES drivers alike. Live state that also changed (the stencil masks) is answered by
      the real context and needs nothing. stock-gpu-parity finds the next
      drift: it fails where stock Firefox of the recorded release and of the
      shipped one differ on the same machine and Camoufox does not follow the
      shipped one.

  - id: canvas-fingerprint-is-hashed-not-truncated
    title: The canvas check hashes pixels, not a prefix of the data URL
    check: automated
    evidence:
      - "browser/tests/build-tester/src/lib/checks/collectors.ts returned canvas.toDataURL().substring(0, 100)"
      - "CI reported two contexts sharing a canvas fingerprint; 8 local runs across two rendering paths never did"
    rationale: >-
      A hundred characters of a data URL is not the image. "data:image/png;base64,"
      takes 22 of them, leaving about 58 bytes of PNG: the signature, the IHDR
      giving width and height, the IDAT header, and roughly fifteen bytes of
      deflate stream. Cross-profile uniqueness was therefore decided by whether
      the noise happened to land in the top-left of the first scanline, and two
      contexts whose canvas differed everywhere else read as identical. Worse,
      the stability check compared the same prefix between two collections, so
      it passed on PNG headers and could not have noticed non-deterministic
      output. getImageData is the surface a fingerprinter reads; hash that.

  # -------------------------------------------------------------------------
  # Teardown
  # -------------------------------------------------------------------------

  - id: launch-failure-tears-down-playwright
    title: A failed launch must not leak the Playwright session
    check: automated
    evidence:
      - "issue #82 / PR #655 / commit 0d54401"
    rationale: >-
      The Playwright session is started before the browser. If the launch then
      raises -- bad proxy, missing binary, invalid options -- the driver process
      and its connection stay alive with nothing holding them. Every launch path
      wraps the launch and calls the base __aexit__ on failure.

  - id: close-failure-still-tears-down
    title: browser.close() raising must not skip teardown
    check: automated
    evidence:
      - "issue #82 / PR #655 / commit 0d54401"
      - "commit fd1bb2f: the same rule for the virtual display"
    rationale: >-
      A browser that has already crashed makes close() raise, and the original
      code let that exception skip the driver teardown -- so the failure mode
      that leaks is exactly the one that happens under load. The close goes in a
      try, the teardown in the finally. The virtual display is cleaned up the
      same way.

  # -------------------------------------------------------------------------
  # Contexts and windows
  # -------------------------------------------------------------------------

  - id: no-viewport-when-window-is-spoofed
    title: Spoofed window dimensions imply no_viewport
    check: automated
    evidence:
      - "issue #666 / PR #673: page-recycle hang under spoofed window dims"
    rationale: >-
      Playwright's default viewport deadlocks Juggler when the window has been
      spoofed to a different size. Both launch paths default to no_viewport when
      spoofs_window_dimensions() is true, unless the caller said otherwise.
    expect:
      module: camoufox.utils
      has_callables: [spoofs_window_dimensions, attach_no_viewport_default]

  - id: virtual-display-skips-screen-clamp
    title: A virtual display never clamps the generated screen
    check: automated
    evidence:
      - "python/src/camoufox/utils.py: the `not virtual_display` guards"
    rationale: >-
      This is what makes the 1x1 default safe. If clamping applied, a 1x1 root
      window would clamp every generated screen down to 1x1 and the fingerprint
      would be absurd. The guard and the 1x1 default stand or fall together --
      remove the guard and the display size stops being a free choice.

  - id: evaluate-is-isolated-by-default
    title: page.evaluate runs in an isolated world; "mw:" is the opt-in hatch
    check: automated
    evidence:
      - "PR #745 / issue #738: let init scripts reach the page world with 'mw:'"
      - "commit c3d5721: evaluate in an isolated world, with an opt-in main-world hatch"
    rationale: >-
      Injected automation JavaScript running in the page's world is visible to
      the page, which is the thing this fork exists to prevent. Isolation is the
      default and the "mw:" prefix is the deliberate, per-call way out. Upstream
      Playwright's suite is run with isolation off because it asserts upstream
      semantics -- that flag must never become the default here.

  # -------------------------------------------------------------------------
  # Juggler frame lifecycle
  # -------------------------------------------------------------------------

  - id: per-frame-state-released-on-dispose
    title: Anything reset when the document changes is also released when the frame dies
    check: automated
    evidence:
      - "browser/additions/juggler/content/FrameTree.js: _masterSandbox was cleared in _onGlobalObjectCleared() but not in Frame.dispose()"
      - "upstream Playwright's FrameTree.js has no _masterSandbox, and dispose() was inherited from it verbatim"
    rationale: >-
      Frame.dispose() came from upstream, which has no Camoufox-specific
      per-frame fields. So when one is added, only the navigation path tends to
      learn about it, and a frame that is *destroyed* rather than navigated
      keeps it -- which is the common case on any page that creates and removes
      iframes. _masterSandbox made that concrete: built over the page window
      with a system principal, it holds the window's global and with it the
      whole document, so a retained one keeps a dead document alive. The
      invariant is simply that the two teardown paths agree: a field worth
      resetting when the document changes is worth releasing when the frame goes
      away, and a sandbox needs nuking rather than just dropping.

  - id: fingerprint-setters-sealed-per-window
    title: The window.setXxx() fingerprint setters start sealed, and the seal is per window
    check: manual   # browser/tests/playwright/patches/fingerprint-setter-seal.py
    evidence:
      - "PR #749 (7911f4a): setters a fingerprint never called stayed on window, and a launch with no init script leaked all of them"
      - "browser/patches/window-setter-seal.patch"
    rationale: >-
      The setters are configuration API for the automation side, not page API.
      A window starts sealed; juggler unseals it, runs the init scripts that
      apply a per-context fingerprint, and seals it again before page script
      runs. Sealed is the default so the failure is closed: a window automation
      never drives (the binary launched as a plain browser) never offers them,
      instead of offering them permanently to whatever loads. The flag is per
      window, not per browsing context: every new document needs its own
      configuration window, and a context-wide flag would seal on the first
      about:blank and leave every later navigation unable to apply a
      fingerprint. The Func= guards consult the flag, which is what stops the
      DOM resolve hook handing a name back after it has been deleted.

  # -------------------------------------------------------------------------
  # Input
  # -------------------------------------------------------------------------

  - id: input-through-one-chokepoint
    title: Every synthesized input event goes through MouseDispatch.js
    check: manual   # enforced by browser/scripts/check-input-dispatch.py in CI
    evidence:
      - "docs/input-dispatch.md: four deadlocks between 2026-04 and 2026-09"
      - "issues #225, #677, #751, #752"
    rationale: >-
      Four separate deadlocks, each fixed by adding one more coordinate guard at
      one more call site, which does not converge -- the trigger set is not
      enumerable, because whether a coordinate reaches the renderer depends on a
      rounding accident in the fractional height of spoofed browser chrome. One
      unbounded await for an ack that never arrives wedges input for every tab
      in the process, permanently, at 0% CPU.

  # -------------------------------------------------------------------------
  # Human input
  #
  # The evidence is five private recordings of one right-handed person filling
  # one form on stock Firefox: macOS with a mouse and with a trackpad (both at
  # device pixel ratio 2), and Windows with a mouse at 2.5 and a touchpad at 2.5
  # and 1. Replays through Camoufox were compared with them event by event. The
  # recordings stay private; the figures below are what they showed. Each
  # figure is credited to what varies it: the OS, the input device, the
  # display (scale or refresh rate) or the person. There is no Linux recording,
  # so nothing here describes Linux.
  # -------------------------------------------------------------------------

  - id: humanize-timing-is-the-engine-and-shape-is-the-browser
    title: The humanize engine decides when input happens; the browser decides what one event looks like
    check: manual
    evidence:
      - "private recordings: rapid-click down-to-down was 141-157 ms for the person and 226-296 ms for replays that let the browser add its own waits"
      - "private recordings: wheel deltaMode, wheelDelta, coalesced pointer events and fractional coordinates differ by OS and display scale and are invisible to a driver, which sends one Juggler command per event"
    rationale: >-
      Timing spans events, so only the process that plans the sequence can get
      it right: paths, holds, dwells, typing gaps, Shift lead and trail, paste
      chords and the scroll plan belong to the engine (myuri by default), drawn
      for the launch identity's OS. Everything a page reads off a single event
      -- deltaMode, wheelDelta, modifiers on a wheel, coalesced events,
      fractional coordinates, a zero-distance move, the timestamp grid --
      belongs to the browser, because a driver cannot set it. The browser's own
      paste and auto-Shift timing remains only for raw Playwright, and steps
      aside when the engine holds Shift itself.

  - id: humanize-smart-actions-are-myuris
    title: myuri is the one implementation of humanized input; Camoufox adapts Playwright to it
    check: automated
    evidence:
      - "daijro/camoufox#1000: the launchers carried a second smart click (scroll into view, hit test, retry) beside the one in myuri; it moved into myuri (JWriter20/Myuri#23) and both launchers drive myuri.Actions"
      - "JWriter20/Myuri#23: Actions takes a host of input calls and page reads, so one implementation drives Playwright in Python and TypeScript"
    rationale: >-
      Two copies of the decisions around a click drift, and input built from
      two drifting copies is a fingerprint. The launchers hold only the host
      (each event a Playwright input call), the wrappers that route
      Playwright's methods to myuri, and the timeout and error Playwright's
      action would give. A page read that decides where to aim or whether a
      press lands (the hit test, the scroll plan) is myuri's, imported, never
      written again here.

  - id: humanize-parts-replace-myuris-pieces
    title: A caller customises humanized input by replacing myuri's parts, with one seeded stream per browser
    check: manual
    evidence:
      - "daijro/camoufox#1000: custom(fn) per channel replaced the whole channel, so a caller who wanted their own scroll lost myuri's clicks; it gave way to myuri(part=fn), with move, press, point, reaches, into_view, wheel, type and key"
      - "browser/tests/humanize/sequence.json: one seeded scenario plays the same input in both launchers"
    rationale: >-
      myuri(part=fn) keeps every other part myuri's, so a replaced scroll still
      serves myuri's clicks and a replaced move still ends where myuri
      presses. A part is called with the page, its arguments, default (myuri's
      part), rng and play; Playwright calls inside it are Playwright's own, so
      it never recurses into myuri. raw() is Playwright's behaviour: its parts
      are Playwright's, a move one event and a scroll into view Playwright's.
      The seed is 32 bits, myuri's Mulberry32, and the browser has one stream
      that every page and part draws from, so two pages never replay the same
      draws and Python and TypeScript draw the same numbers.

  - id: human-click-timing
    title: Click timing belongs to the person, not the OS; the cursor's stillness before a press is the device's
    check: manual
    evidence:
      - "private recordings: click hold p50 94-109 ms and rapid-click down-to-down 141-157 ms on both OSes with both devices"
      - "private recordings: last move to pointerdown p50 48-63 ms with a mouse and 16-31 ms with a touchpad or trackpad, on both OSes"
      - "private recordings: every Windows median is a multiple of 15.6 ms, the OS's input timestamp grid, so Windows and macOS figures differ by up to one grid step for that reason alone"
      - "private recordings: a later press in a run of quick clicks in place is held 63/83/113 ms (p10/50/90, 130 presses), a first press 78/96/125 ms; the pointer does not move between them"
    rationale: >-
      These are the targets the engine's click model is fitted to, with one
      model for every OS. A tap on a touchpad presses sooner after the last
      move than a mouse button does. The press is a down and an up where the
      engine's path ended, held for its drawn hold: Playwright's click moves
      first, and the browser counts that move against the next press's click
      count. Playwright's trial click is no dry run either (it presses, and
      the page swallows the events), so myuri runs its own hit test in the
      isolated world and aims again on a miss. A click on the target the
      pointer already rests on presses where it is, and the engine is told
      how long ago the last press was released, so a click within the OS's
      500 ms continues the run as a person's quick clicks do.

  - id: human-pointer-moves-follow-the-os
    title: How moves reach the page is the OS's; how often is the display's
    check: manual
    evidence:
      - "private recordings (Windows, 60 Hz): one pointermove per frame (gap p50 16 ms) carrying every report since the last, 8 from a high-rate mouse and 2 from the touchpad"
      - "private recordings (macOS): one pointermove per report with a coalesced list of length 1, 10 ms from a 100 Hz mouse and 8 ms from a trackpad, each on a display refreshing as fast (100 and 120 Hz, rAF 10.0 and 8.3 ms)"
      - "stock 159.0 on macOS, real devices, every modifier logged in the parent and the page: none set or changed between moves, so the queue's coalescing check passed throughout"
      - "stock 159.0 on macOS, moves fed through the native-event hook at 100-250 Hz on a 60 Hz display: one pointermove per frame carrying 2-4"
      - "stock 159.0, injected input at 125 and 1000 Hz: Linux (XTest on X11) gives one pointermove per frame carrying 2 or 17 moves; on macOS, CGEventPost moves are merged by the window server to one per display frame for every app, before Firefox sees them"
      - "stock 159.0 source: the content-process queue (BrowserChild::RecvRealMouseMoveEvent, CoalescedMouseData) has no platform branch and flushes on the refresh driver's tick"
      - "private recordings: fractional pointermove clientX on 78-79% of Windows moves at scale 2.5 and none at scale 1; none from a macOS mouse at scale 2 and 50% from a macOS trackpad; mousemove clientX is always whole"
      - "private recordings (Windows): 9.6-10.7% of mousemoves had no movement at scale 2.5 and 0.4% at 1, all steps inside one CSS pixel; no pointermove repeated a position"
      - "private recordings (macOS): 16-19% of mousemoves had no movement, 98-99% at the exact same position, from a mouse and a trackpad, mostly away from any scroll, click or key"
      - "private recordings: every gap between Windows pointermoves, keydowns and mouse wheel events is a whole number of 15.625 ms ticks (15, 16, 31, 32, 47 ms), from a mouse and a touchpad; coalesced moves within a tick share its stamp; a precision touchpad's wheel events, which Firefox makes itself once per frame, are off the grid"
      - "private recordings: macOS input timestamps are off that grid (2-7% of keydown gaps on it)"
      - "camoufox replays of the same tasks before input-timestamp-tick.patch: 2% of Windows pointermove gaps on the grid and no coalesced moves sharing a stamp"
    rationale: >-
      Each is read off the event, so each is the browser's. Firefox flushes
      its move queue once per frame on every OS, so the cadence is the
      display's refresh rate and the coalesced count is the report rate over
      it: one per report on a Mac whose display keeps up with the pointer,
      several on a 60 Hz one (driven-move-coalescing). It is the host
      display's, not the identity's. The sub-pixel steps follow the display
      scale on Windows (driven-move-device-pixels), and an exact repeat is part
      of how macOS delivers moves. A Windows launch stamps driven mouse, wheel
      and key events on the OS's tick (driven-input-timestamp-grid). The engine
      plans moves at a device's report rate; it draws no OS grid. A
      recording's cadence is read against that session's frame rate: a display list taken at another time misattributed
      it once. Injected macOS input is merged by the window server before
      Firefox sees it, so macOS input is measured with a real device.

  - id: click-count-and-key-repeat-are-the-os
    title: The claimed OS counts clicks and repeats held keys, for all driven input
    check: manual
    evidence:
      - "stock 159.0 source: nsWindow.cpp counts a press within GetDoubleClickTime of the last one unless the pointer left the SM_CXDOUBLECLK box around the last release, and sets 2 on WM_*DBLCLK; macOS takes NSEvent clickCount; GTK sends 2BUTTON and 3BUTTON presses"
      - "private recordings (Windows, mouse and touchpad): those rules with 500 ms, a 4 device-pixel box and Windows' double click within 1 device pixel of the last single press give the recorded detail of 651 of 652 presses; fifteen quick presses in place count 1, 2, 3, 2, 3, ..."
      - "private recordings (macOS, mouse and trackpad): 500 ms and 3 points, unbounded, give 503 of 504"
      - "private recordings: held keys repeat after 500 ms, every 31.25 ms on Windows and 83.3 ms on macOS; a Windows Shift held about half a second or longer repeats, a macOS modifier never does; only the last key pressed repeats"
      - "GNOME's schema defaults: repeat delay 500 ms, interval 30 ms; the XKB keymap sets repeat= False for the modifiers"
      - "camoufox replays of the same tasks before the change: every driven press reported the client's clickCount (1 for each page.click) and no held key repeated"
    rationale: >-
      Both are the OS's, read off the event, so they follow the claimed OS for
      every driven press and key, raw Playwright included, not only a
      humanizer's: a page sees fifteen quick clicks counted 1, 1, 1 or a key
      held a second that never repeats whoever drove it. Juggler ignores the
      client's clickCount (driven-click-count) and repeats the last held key
      with the OS's delay and interval (driven-key-repeat). The Linux values
      come from the defaults, not recordings. docs/input-dispatch.md has the
      rules.

  - id: human-wheel-is-line-mode
    title: A notched wheel scrolls in lines, shaped by the OS
    check: manual
    evidence:
      - "private recordings (Windows, wheel set to 3 lines): deltaMode 1, 6 lines and wheelDelta -120 per notch; a fast spin batches 2-4 notches into one event at about 16 ms gaps"
      - "private recordings (macOS): deltaMode 1, 1-13 accelerated lines per event, wheelDelta/delta 48 vertical and 27 horizontal, at about 20 ms gaps"
      - "private recordings: horizontal scrolling held Shift on every macOS event; on Windows it arrived as a mix of Shift with deltaY and deltaX"
      - "private recordings: a touchpad or trackpad scrolls in pixels (deltaMode 0) on both OSes"
      - "private recordings (Windows mouse): every short scroll opened with a lone notch, then strokes of 1-5 notches (median 2) 47-78 ms apart; a stroke of 2-10 notches arrived about one notch a 15.6 ms tick"
      - "private recordings (macOS mouse): after a re-grip of up to 140 ms the next stroke started at the last frame's lines or one fewer in 81% of 83; after 160 ms or more, always at one line"
    rationale: >-
      Both mice were the same make with notched wheels, so the difference is
      the OS. deltaMode, the wheelDelta ratio and the Shift modifier are
      properties of the event, so the browser sets them for the launch OS; how
      many notches and how far apart is the engine's scroll plan, which nudges
      a short scroll notch by notch and, on macOS, keeps the speed across a
      quick re-grip as the OS does.

  - id: human-typing-timing
    title: Typing timing belongs to the person and the keyboard, not the OS
    check: manual
    evidence:
      - "private recordings: key hold p50 95-125 ms and keydown gap p50 129-235 ms; the spread follows the keyboard and the session more than the OS"
      - "private recordings: 33% of keydowns arrive with another key still held; 2.67 Shift keydowns per capital, all left Shift"
    rationale: >-
      These are the targets the engine's keystroke model is fitted to, with
      one model for every OS; only the shortcut modifier follows the OS. The
      engine presses Shift itself, so the browser's auto-Shift must not add a
      second one.

  # -------------------------------------------------------------------------
  # Config schema
  # -------------------------------------------------------------------------

  - id: config-keys-are-never-deleted
    title: A key leaves browser/settings/properties.json only by being marked removed
    check: automated
    evidence:
      - "issue #835: camoufox 0.4.11 failed to launch v156.0.1-beta.34 with 'Unknown property navigator.appCodeName in config'"
      - "#787 (180e655) deleted 35 keys the browser no longer read; every release from v156.0.1-beta.32 shipped without them"
    rationale: >-
      properties.json ships inside the browser, and every released library
      validates its config against the copy in whatever browser it finds.
      Libraries up to 0.4.x raise on a key they send that the browser does not
      declare, and they accept every browser release below 1, so they download
      new releases on their own. Deleting a key therefore breaks launches for
      everyone on an older library the moment a release ships. A key the
      browser stops reading is instead kept with a "removed" field: older
      libraries still validate it, the browser ignores it, and current
      libraries skip it with a warning that it has no effect.

  # -------------------------------------------------------------------------
  # Network
  # -------------------------------------------------------------------------

  - id: https-first-stays-on
    title: HTTPS-First keeps Firefox's default, on
    check: manual
    evidence:
      - "#638 (restored in 0e4151f) set dom.security.https_first=false in camoufox.cfg so Playwright's GET-only test proxy passed"
      - "914b575 removed it again; ci/skiplist.yml lists the proxy tests it fails, with the reason"
      - "measured 2026-10-08 on a v156.0.1-beta.32 build: every proxy test in test_proxy.py and test_browsercontext_proxy.py passes with the pref appended to camoufox.cfg, and fails without it"
    rationale: >-
      Stock Firefox tries an http:// navigation as https:// first, and a server
      sees whether a browser does, so turning it off marks the browser as not
      stock Firefox. Playwright's own Firefox turns it off (playwright.cfg), and
      upstream's proxy tests depend on that: their proxy is the test server,
      which answers plain GETs and cannot open the CONNECT tunnel the upgrade
      needs. A real proxy handles CONNECT, as every https:// site needs it to.
      Those tests are skiplisted rather than passed by changing the browser.

  - id: no-enterprise-policies
    title: Camoufox ships no policies.json; what a policy did lives in camoufox.cfg or the bundled uBO
    check: manual   # browser/tests/playwright/patches/enterprise-policies.py
    evidence:
      - "measured 2026-10-26 on 158.0.1-beta.34: with policies.json, DoHHeuristics enterprisePolicy() returned policy_without_doh and DoH stood down; without it, no_policy_set"
      - "the same file's SearchEngines policy and no-search-engines.patch left one inert engine where stock 158.0.1 adds Google, Bing, DuckDuckGo, Perplexity, Wikipedia (en), eBay (search-service-init.py)"
    rationale: >-
      Any policy file puts Firefox in enterprise mode, whatever it holds, and
      enterprise mode is visible from outside: DNS over HTTPS stands down, and
      the policies' own effects (no search engines, system addons removed)
      differ from stock. Updates, studies and the first-run page stay off
      through prefs in camoufox.cfg; uBO keeps its packaged lists through its
      own default (scripts/fetch-ubo.py freeze_lists).

  - id: no-background-traffic
    title: Firefox's background services stay off; what a page can see of them comes bundled
    check: manual   # browser/tests/playwright/patches/no-background-traffic.py, tracking-protection-lists.py
    evidence:
      - "toolkit/components/url-classifier/UrlClassifierRemoteSettingsService.sys.mjs: the moz-sbrs update scheme reads its lists through RemoteSettings, so the build's dumps can supply them"
      - "dom/push/PushServiceWebSocket.sys.mjs _queueRequest: a registration opens the socket itself, so the startup connection is not needed for pushManager.subscribe()"
      - "measured 2026-11-06 on the changeset of tracking-protection-lists: 36 of 446 records, 2.82 MB, apply to Firefox 159"
    rationale: >-
      Remote Settings, Push, connectivity and captive-portal probes, Safe
      Browsing, region lookup and new tab feeds send requests no page asked
      for, which only the proxy operator and Mozilla see. A page sees none of
      them, but it does see the lists Remote Settings delivers: without the
      tracking tables a fingerprinting script stock blocks would load. So the
      requests stay off and the page-visible collections are a pinned snapshot
      (scripts/remote_settings.py pin, run on every Firefox bump). Push still
      works for a page that subscribes. Media plugin updates stay on: without
      them getCapabilities() lists no H264 and Widevine never resolves (#713),
      and neither ships with Firefox, so a fresh profile asks Mozilla for them
      and downloads them from Cisco and Google.

  - id: ipv4-only-network-not-disable-ipv6
    title: geoip without a proxy keeps IPv6 only where it agrees, and never uses network.dns.disableIPv6
    check: manual
    evidence:
      - "issue #849: with geoip=True and an IPv4 address, network.dns.disableIPv6 made IPv6-only sites fail with NS_ERROR_UNKNOWN_HOST"
      - "netwerk/dns/nsDNSService2.cpp GetAFForLookup and nsHostResolver.cpp's IP-literal path: the pref only stops AAAA lookups, so an IPv6 literal still connects and WebRTC still gathers IPv6"
      - "browser/tests/playwright/patches/ipv4-only-network.py: with network:ipv4Only, IPv6 literals and AAAA-only names fail at once, dual-stack names use IPv4, and WebRTC offers no IPv6 candidate; with it off, all of them use IPv6"
    rationale: >-
      A real browser is on a dual-stack network or an IPv4-only one, and the
      pref made a third state no network produces: names never resolve to IPv6
      but IPv6 literals connect, so a page could read the host's IPv6 address
      and tell the browser apart. Without a proxy, sites see this host's own
      addresses, and public_ip() prefers IPv4, so the identity comes from the
      IPv4 address. The launcher keeps IPv6 when the host's IPv6 address
      geolocates to the same timezone and region, and otherwise sets
      network:ipv4Only, which makes the browser behave exactly as on an
      IPv4-only network. A failed IPv6 lookup counts as no IPv6. Behind a proxy
      the browser reaches sites only through the proxy, so nothing is set.

  # -------------------------------------------------------------------------
  # Branding
  # -------------------------------------------------------------------------

  - id: pages-see-firefox-not-camoufox
    title: Camoufox builds as an official Firefox, and pages load Firefox's branding files
    check: automated
    evidence:
      - "issue #847: hCaptcha tokens rejected on a site that validates them server-side, with nothing attached to the browser"
      - "measured 2026-10-10 against stock Firefox 156.0.1: every chrome://branding/content/ logo (contentaccessible=yes) was Camoufox's, and browser-main.js differed because the non-official build ships browser-development-helpers.js and contentaccessible-parity.patch had to remove its loader"
      - "contentaccessible-parity.patch (8c2047a) had declined MOZILLA_OFFICIAL as moving telemetry, update-channel and branding defaults; base.mozconfig now sets it and switches MOZ_TELEMETRY_REPORTING back off"
    rationale: >-
      Stock Firefox releases are official builds with Firefox branding, so
      anything a page can reach must be what that build ships. Camoufox keeps
      its own name only where no page can see it: the binary, window class,
      profile directory and OS icons. MOZILLA_OFFICIAL also switches on
      compile-time telemetry reporting, which base.mozconfig turns back off;
      turns dump() off, which Juggler's readiness line needs, so camoufox.cfg
      turns it back on; and makes Widevine verify host binaries that Camoufox
      does not sign. contentaccessible-parity.py compares every
      content-reachable file's bytes with a stock release.

  # -------------------------------------------------------------------------
  # Juggler
  # -------------------------------------------------------------------------

  - id: juggler-is-not-a-chrome-package
    title: Juggler loads from resource://gre/modules/juggler/, never a chrome package
    check: automated
    evidence:
      - "issue #847: hCaptcha's hsw.js runs new Worker('chrome://juggler/content/content/WorkerMain.js'); the constructor returns while a juggler package is registered and throws a SecurityError when none is, and a returned Worker gets a puzzle"
      - "the reporter's bisect on #847: removing only the manifest line passes, renaming the package passes, an inert Juggler.js under the registered name fails"
      - "measured 2026-10-12: inside a namespace stock Firefox registers (resource://gre, chrome://devtools) the constructor behaves the same for existing and missing files"
    rationale: >-
      Content processes receive every registered chrome package and resource
      host, so a name only Camoufox registers is detectable whatever the files
      under it do. A renamed or per-build-random package only moves the tell,
      since the next probe asks for the new name. Juggler's files are installed
      with FINAL_TARGET_FILES under modules/juggler/, inside resource://gre,
      which every Firefox registers. contentaccessible-parity.py compares the
      registered names with a stock release and runs the Worker probe.

  # -------------------------------------------------------------------------
  # Releases
  # -------------------------------------------------------------------------

  - id: releases-ride-a-twice-monthly-train
    title: A merge to main is tested, not released; releases ship on the 1st and 15th
    check: manual   # ci/tests/test_release.py
    evidence:
      - "issue #863: seven browser prereleases (v156.0.1-beta.32 to beta.38) shipped between 2026-09-28 and 2026-10-13, one per merge"
      - "PyPI and npm trusted publishing match the top-level workflow file, so publishing stays in release.yml rather than a reusable workflow"
    rationale: >-
      Releasing every merge gave users a new browser every few days, and stable
      releases waited on a maintainer remembering to tag one. The train
      promotes the newest prerelease to stable and cuts the next one from main
      twice a month, so a prerelease has had two weeks of use before it becomes
      stable. Weekly was considered and rejected as too many updates for users
      to manage. A fix that cannot wait is cut by dispatching release.yml on
      main, and an open issue labelled `regression` holds the promotion.

  - id: a-tested-tree-is-tested-once
    title: A push to main that lands a tree its pull request run passed, and a cut of a commit main's run passed, do not run the suites again
    check: manual   # ci/tests/test_carry.py, ci/tests/test_release.py
    evidence:
      - "main runs 43528865366 and 43540606337 re-ran every suite on trees their pull request runs (#1038, #1039) had passed; the only failure in each was the getter-cost timing guard, which re-running only re-sampled"
      - "release.yml's dispatch ran tests.yml a third time on a commit main's run had already passed before building anything"
    rationale: >-
      A pull request run tests the merge of the pull request into main as main
      stood then. With nothing merged in between, the squashed commit has that
      tree exactly, so a second run proves nothing new and only gives
      non-deterministic checks another chance to fail after the merge. Main
      still runs what the pull request could not, the stealth check, and tests
      in full whenever its tree differs. A cut reuses main's own gate result,
      the same check a promotion already requires.

  # -------------------------------------------------------------------------
  # Build
  # -------------------------------------------------------------------------

  - id: builds-are-optimized-like-stock
    title: Every build, tested or shipped and on every OS, uses stock's PGO profile, stock's LTO mode and Rust SIMD
    check: automated
    evidence:
      - "PR #886: measured against stock 152.0.4 on the same host, an unoptimized build ran Gecko's C++ 1.3-1.8x slower (JSON.parse 1.52x, location.href 1.77x, createElement 1.32x, TextEncoder 1.45x) and a regexp replace 1.04x, so JSON.parse over a regexp replace read ~3.3 where stock reads ~2.2"
      - "Stock 158.0.1's about:buildconfig: --enable-profile-use=cross, --with-pgo-profile-path, --with-pgo-jarlog, MOZ_LTO=cross"
      - "Firefox 158 build/moz.configure/lto-pgo.configure: --enable-lto=cross is full LTO when PGO and MOZ_AUTOMATION are on and the target is x86_64 Linux or Windows, and ThinLTO otherwise; a profile that does not match a function is a warning (-Wno-error=backend-plugin)"
      - "Firefox 158 taskcluster/kinds/build: every shippable desktop build has use-pgo, and Linux arm64 uses the x86_64 Linux profile"
      - "Taskcluster indexes each release's generate-profile task by its commit (gecko.v2.mozilla-release.revision.<commit>.firefox.<platform>-profile), and the task's chain-of-trust.json records the profile's sha256"
      - "PR #886 review: LTO had entered only the tests.yml build, so a release would have been tested on an LTO Linux binary and shipped binaries built without it"
    rationale: >-
      A page can time how fast Gecko's C++ runs against JIT-compiled script, so
      a build optimized differently from stock stands out. Each build uses the
      profile Mozilla trained for the stock release of the same Firefox, pinned
      by sha256 in scripts/data/pgo-profiles.json, so the code Camoufox does
      not patch is optimized as stock's is. Functions a patch changes lose
      their profile data and nothing else. The options are in base.mozconfig,
      which every build copies (the tests.yml build, multibuild.py and
      release.yml alike), so the binary CI tests is configured like the
      binaries a release ships. Full LTO is asked for on x86_64 Linux and
      Windows, as stock's configure picks it under MOZ_AUTOMATION, without
      setting MOZ_AUTOMATION. Rust comes from the release Mozilla builds the
      tree with (scripts/patch.py reads taskcluster/kinds/toolchain/rust.yml),
      because lld cannot read Rust bitcode from an LLVM newer than the
      bootstrapped clang's, and a Rust profile only fits that compiler.

  - id: patches-never-edit-additions
    title: A patch never edits a file browser/additions/ provides; the change goes in the addition
    check: automated
    evidence:
      - "release run 43631788944: the aarch64 targets failed on an undeclared sk_cpu_emulates_x86 and the x86 targets on an undefined opus_mozilla_set_emulate_x86, both from cpu-vendor-estimates.patch hunks to four additions (#1034)"
      - "make set-target (scripts/patch.py --mozconfig-only), which multibuild.py runs for each target, copied the additions over the patched tree, so the hunks had been applied and were then overwritten"
    rationale: >-
      An addition is a whole file this repository owns, so the copy in
      browser/additions/ has to be the file that is compiled. A hunk on top of
      it holds only until the additions are copied again, and a release copied
      them after the patches while a pull request's build did not, so the
      tests passed on code no release contained.

  - id: one-build-entry-point
    title: A pull request and a release build through one command, ci.run_build
    check: automated
    evidence:
      - "release runs 41280578561, 43352392915, 43395652803 and 43631788944 each failed on a commit whose tests had passed, in a step only release.yml ran: midl.exe under Wine (twice), verify-fonts.py, and make set-target"
      - "run 43631788944: tests.yml built with make build and release.yml with multibuild.py, whose make set-target changed the sources after they were patched"
    rationale: >-
      A step only a release runs is run for the first time by a release. The
      pull request's build job therefore runs the release's command for linux
      x86_64 (retarget, build, package), the preflight jobs run its front half
      and compile the patched sources for every other release target, and all
      of them set up the runner through .github/actions/build-host. Linking
      and packaging the cross-compiled targets is all a release does first.

  - id: relay-hop-may-fragment
    title: A QUIC datagram to a SOCKS5 relay may be fragmented on the way there, and is never made smaller
    check: manual   # browser/tests/playwright/patches/http3-socks5-udp.py (the relay behind a 1280-byte link)
    evidence:
      - "stock Firefox 159 on its QUIC socket: HttpConnectionUDP sets PR_SockOpt_DontFrag on IPv4 (IP_PMTUDISC_DO on Linux, IP_DONTFRAG on macOS, IP_DONTFRAGMENT on Windows), then quinn-udp 0.5.15 sets IP_MTU_DISCOVER=IP_PMTUDISC_PROBE and, on IPv6, IPV6_MTU_DISCOVER=IPV6_PMTUDISC_PROBE and IPV6_DONTFRAG on Linux, IP_DONTFRAG and IPV6_DONTFRAG on macOS, IP_DONTFRAGMENT and IPV6_DONTFRAG on Windows; network.http.http3.pmtud is false, so a datagram is 1252 bytes to an IPv4 peer and 1232 to an IPv6 one"
      - "the packet to the relay: payload plus a 10-byte (IPv4 peer) or 22-byte (IPv6 peer) header plus 28 (IPv4 relay) or 48 (IPv6 relay) bytes of IP and UDP: 1290, 1310, 1282 or 1302 bytes, all over 1280. A name is never the destination of a datagram: a proxy given names is sent no QUIC"
      - "2026-11-21, a relay reached over a 1280-byte link, www.cloudflare.com/cdn-cgi/trace with proxy_dns='doh': http=http/2 on all four requests with don't-fragment kept, six sendmsg calls failing EMSGSIZE; the same with don't-fragment cleared and sends still segmented (UDP_SEGMENT 1262); http=http/3 from the second request with one datagram per send"
      - "http3-socks5-udp.py, the relay in a container behind a docker network of MTU 1280: 13 of 14 checks pass before the change and the narrow-link one fails with every answer over TCP; after it the first datagrams the origin receives are 1252, 1252, 1252 and 285 bytes, and with no proxy 1252, 1252, 1252 and 284 (the guard compares the first two)"
    rationale: >-
      Shrinking the datagram to fit the hop would change what the server
      receives, which is the one thing the relay must not change. Keeping
      don't-fragment means no HTTP/3 behind any link under 1310 bytes, which
      a direct Firefox on that link has. So the hop to the relay, which no
      server sees, gives up don't-fragment (IP_PMTUDISC_DONT on Linux IPv4;
      IPV6_PMTUDISC_WANT and no IPV6_DONTFRAG on IPv6, where only the sender
      fragments) and segmented sends, which the kernel refuses to fragment.
      The relay sends the datagram on whole, with don't-fragment set
      (docs/proxy-dns.md).

  - id: socks5-proxy-resolves-by-doh
    title: Behind a SOCKS5 launch proxy the browser resolves names itself, by DoH through the proxy
    check: manual   # browser/tests/playwright/patches/http3-socks5-udp.py, python/tests/test_proxy_dns.py
    evidence:
      - "crypto.cloudflare.com/cdn-cgi/trace, 2026-11-21, one build and one SOCKS5 proxy: sni=encrypted with no proxy and with proxy_dns='doh', sni=plaintext with proxy_dns='exit'"
      - "www.cloudflare.com/cdn-cgi/trace, same day: http=http/3 with no proxy and with proxy_dns='doh'; a proxy given names is sent no QUIC (http3-socks5-udp.py)"
      - "MOZ_LOG=nsHostResolver:5 over a proxy_dns='doh' session: no getaddrinfo call, and the one name the proxy was sent is the DoH host"
      - "Remote Settings doh-config on 2026-11-21: rolloutEnabled for US, CA, RU and UA, each listing cloudflare-global (https://mozilla.cloudflare-dns.com/dns-query)"
    rationale: >-
      A proxy that is handed names leaves the browser without HTTPS records,
      so it sends GREASE ECH where the same Firefox with no proxy sends a real
      one, and never starts HTTP/3: both are visible to the server on every
      connection. Resolving by DoH through the proxy removes both, and its
      cost is that the resolver an authoritative DNS server sees is
      Cloudflare's rather than the exit network's, which is what stock shows
      in the rollout countries and what a user who turned DoH on shows
      elsewhere. proxy_dns='exit' keeps the old behaviour for a proxy that
      cannot carry DoH (docs/proxy-dns.md). A context's own proxy stays on
      'exit': the browser has one DoH client, on the launch proxy.

  - id: doh-mode-keeps-firefox-resolver-timeouts
    title: proxy_dns='doh' keeps Firefox's DoH-only timeouts, and its HTTP/3 fallback timers
    check: manual   # measured with a local SOCKS5 relay and DoH server that delay or refuse
    evidence:
      - "netwerk/dns/TRRService.cpp, GetRequestTimeout (Firefox 159): with network.trr.mode 3 a request waits network.trr.request_timeout_mode_trronly_ms (30000), not the 1500 of network.trr.request_timeout_ms; mode 3 also turns confirmation off (CONFIRM_DISABLED) and never blocklists a name"
      - "2026-11-22, Firefox 159 build behind a local SOCKS5 relay: the CONNECT to the DoH host granted 8 s late, the page loads after 8.1 s; each DoH answer 8 s late, it loads after 16.1 s; the CONNECT refused with reply 2, the navigation fails with NS_ERROR_UNKNOWN_HOST at once (8 refused CONNECTs), and one started after the relay grants it loads"
      - "same day, 60 new contexts per case, 30 ms and 60 ms each way between browser and relay, against the same delay to the origin with no proxy: with an HTTPS record (alpn=h3) the navigation was HTTP/3 in 60 of 60 in all four cases; with Alt-Svc alone the first HTTP/3 answer was the second fetch in 59 or 60 of 60 in all four"
      - "same relay granting UDP ASSOCIATE 40, 120 and 300 ms later than a CONNECT: the navigation was HTTP/3 in 20 of 20 each time"
    rationale: >-
      A page that fails with NS_ERROR_UNKNOWN_HOST behind a proxy looks like a
      DoH timeout that is too short. It is not: DoH alone waits 30 seconds,
      longer than a system resolver, and the fast failure is a proxy refusing
      the CONNECT to the DoH host, which no timeout or retry in the browser
      answers. The HTTP/3 race is not shifted by the relay either: the
      association costs the round trips a CONNECT costs, so QUIC keeps the
      lead it has with no proxy. Leave network.trr.* timeouts and
      network.http.http3.backup_timer_delay and
      network.dns.httpssvc.http3_fast_fallback_timeout at Firefox's values
      (docs/proxy-dns.md).

  - id: speculative-connects-go-through-the-proxy
    title: Behind a SOCKS proxy a speculative connection is opened, through the proxy
    check: manual   # browser/tests/playwright/patches/link-preconnect-through-proxy.py
    evidence:
      - "Firefox 159, netwerk/base/nsIOService.cpp: IOServiceProxyCallback::OnProxyAvailable returns before the handler is called for any proxy type but 'direct' ('proxies dont do speculative connect'), and nsHttpHandler::SpeculativeConnectInternal builds its connection info with no proxy, so the gate is also what keeps that connection from going around the proxy"
      - "every trigger goes through that one function: link rel=preconnect and a link's mousedown from a content process (NeckoParent::RecvSpeculativeConnect), a 103 Early Hints preconnect, the urlbar, and Juggler's own at a top-level navigation (PageHandler.js)"
      - "2026-11-21, a page with link rel=preconnect to an https origin never otherwise used, the origin recording arrivals: stock Firefox 159 with no proxy opened the connection and sent a ClientHello in 5 of 6 launches; Camoufox behind a SOCKS5 proxy in 0 of 21 (9 with proxy_dns='doh', 12 with 'exit')"
      - "the same page after the change: 9 of 9 launches with proxy_dns='doh' and 12 of 12 with 'exit', stock 6 of 6, the ClientHello's JA4 equal to stock's in every one, every connection arriving from the proxy's exit, and no name asked of this host's resolver"
      - "nsSocketTransport::InitiateSocket refuses a speculative connection whose address is local (bug 853423); for a proxy given the name that address is the any address, which counts as local, so the refusal has to look at the host instead"
      - "behind an HTTP proxy the speculative connection carries no request, so it would stop at the proxy with no CONNECT sent (measured: a TCP connection to the proxy and nothing after it)"
    rationale: >-
      Any page can put a preconnect link to an origin it controls and see
      whether the connection arrives, so a browser that never opens one is
      marked as proxied by one line of HTML. A SOCKS proxy carries a
      connection as the network does, so the speculative one is opened as
      stock opens it, with the connection info the request's channel will
      build, proxy included: it cannot leave around the proxy, and the request
      finds it. No HTTPS record is asked for a name the proxy resolves. An
      HTTP proxy is left as Firefox has it, because nothing would reach the
      origin (docs/proxy-dns.md).

  - id: doh-request-is-not-prefetched
    title: Behind a SOCKS proxy the DoH request's own host is never prefetched on this host
    check: manual   # browser/tests/playwright/patches/doh-proxy-resolves-nothing-here.py
    evidence:
      - "Firefox 160, netwerk/protocol/http/TRRServiceChannel.cpp: BeginConnect calls MaybeStartDNSPrefetch, which skips only an HTTP proxy; nsHttpChannel skips any proxy that resolves the name (GetProxyDNSStrategyHelper). TRR is off for its own server's name, so the prefetch is a getaddrinfo on this host"
      - "network.dns.disablePrefetch was the only other gate; uBlock Origin's 'Disable pre-fetching' sets it once the add-on has started, after the first DoH request of a launch, and Juggler leaves prefetch on behind a proxy that carries DoH (docs/proxy-dns.md)"
      - "doh-proxy-resolves-nothing-here.py, 2026-11-25: 2 of 3 checks in 3 of 3 runs before the change, the DoH server's name resolved by this host's resolver; 3 of 3 checks in 3 of 3 runs after, the resolver log showing every page name answered by DoH and no getaddrinfo"
      - "behind a remote SOCKS5 exit with uBlock Origin loaded, three launch variants three times each, same day: the DoH server's name was looked up on this host in 9 of 9 launches before the change and in 0 of 9 after, every other connection leaving by the exit both times"
    rationale: >-
      With proxy_dns='doh' the exit resolves the DoH server's name and the
      browser resolves every other name through it, so this host's resolver
      should be asked nothing. A prefetch of the DoH request's host told a
      resolver beside the user which DoH server the browser uses, at every
      launch, and a proxied stock Firefox never asks it. The DoH channel
      follows nsHttpChannel's rule: no prefetch when the proxy resolves the
      name. Do not rely on network.dns.disablePrefetch for this; it is on by
      design in doh mode, and uBlock Origin sets it too late.

  - id: http3-is-raced-on-the-exits-clock
    title: Behind a SOCKS5 relay, the timers that start TCP beside QUIC wait for what the proxy cost
    check: manual   # browser/tests/playwright/patches/http3-https-record-socks5.py, ublock-connections-socks5.py
    evidence:
      - "Firefox 160 release, netwerk/protocol/http/nsHttpTransaction.cpp: OnHTTPSRRAvailable arms mFastFallbackTimer for network.dns.httpssvc.http3_fast_fallback_timeout (50 ms) and OnFastFallbackTimer opens a TCP connection; an Alt-Svc route has mHttp3BackupTimer, network.http.http3.backup_timer_delay (100 ms). OnBackupConnectionReady moves the request to TCP if QUIC has not connected. These timers serve the requests Happy Eyeballs v3 does not take (connections-are-raced-as-release-races-them)"
      - "behind a SOCKS5 proxy the first QUIC datagram leaves after the UDP ASSOCIATE (a TCP connect, greeting and request: two or three round trips to the proxy), so both timers ran out before QUIC had sent anything"
      - "an origin with an HTTPS record (alpn h3,h2) and a SOCKS5 proxy 50 ms away each way, same build: with no proxy each of 3 names saw one QUIC connection and no TCP connection; behind the proxy each also saw a TCP connection; with proxy_optimistic_data the requests of new names went over TCP in 5 of 5 runs, and a QUIC connection closed before its relay was ready sent one datagram carrying only CONNECTION_CLOSE; with the association granted after a second, no QUIC at all"
      - "once a TCP connection to the origin exists the backup is ready the moment the timer fires, so every later HTTP/3 attempt was closed before its relay was ready: one lone datagram each, on an association of its own"
      - "a navigation behind the proxy opened two QUIC connections to its origin and one with no proxy: nsHttpHandler::SpeculativeConnectInternal keys the connection with the page's partition key, and a proxied request's connection has none (StoragePrincipalHelper::GetOriginAttributesForHttpConnection, privacy.partition.network_state.connection_with_proxy false), so the speculative connection was never used"
      - "http3-https-record-socks5.py, 2026-11-22: 4 of 7 checks pass before the change and 7 of 7 after; an origin that answers nothing over QUIC is reached over TCP by the same connections either way"
      - "Firefox 160: a page's render-blocking requests keep its other ones in the pending queue (nsHttpConnectionMgr, 'blocked by request context'), and the fast fallback timer of a queued request runs from its HTTPS record all the same; uBlock Origin's 'Disable pre-fetching' sets network.http.speculative-parallel-limit to 0, so no connection has been opened for it"
      - "a page whose stylesheet, image, video, font, EventSource and fetch are at six names of one site, uBlock Origin loaded, no proxy, network.http.happy_eyeballs_enabled false, 2026-11-23: the site 4 ms away sees no TCP connection and every request over HTTP/3 (10 of 10 runs); 40 ms away a TCP connection for five names that carries nothing (5 of 5); 100 ms away a TCP connection for each name, which carry the EventSource, the fetch and the font (11 of 11); six QUIC connections at every distance"
      - "the same page behind a SOCKS5 proxy 50 ms away each way with proxy_optimistic_data, before the change: one QUIC connection, and the image, video, font, EventSource and fetch over TCP at 4 ms and at 100 ms (ublock-connections-socks5.py, 4 of 6 checks in 2 of 2 runs)"
      - "at 100 ms the stylesheet answered 209 ms after its record with no proxy and 612 ms after it behind the proxy, the 403 ms its relay's setup and two round trips come to; a TCP connection was ready 204 ms after it was started with no proxy and 407 ms behind the proxy, where its ClientHello travels behind the CONNECT request, while a QUIC connection's first datagram waits for the reply to UDP ASSOCIATE and its answer crosses the proxy: 305 ms, a round trip to the proxy more"
      - "with a held request's timer waiting for the stylesheet's cost alone, the site saw what it sees with no proxy at 4 and 100 ms, and the EventSource, fetch and font over TCP at 40 ms (2 of 2 runs), where with no proxy QUIC wins by under 20 ms; with the TCP connection started a round trip later instead, the image and video, which join the stylesheet's QUIC connection, never opened the TCP connection they open with no proxy (2 of 2)"
      - "with that round trip waited when the backup connection is ready: equal to no proxy at 4, 40 and 100 ms (3 of 3 runs at 40 ms); ublock-connections-socks5.py 6 of 6 checks in 5 of 5 runs"
      - "the guard's DoH resolver speaks HTTP/1.1; with six connections reused, a page's answers came a round trip to the proxy apart (0, 122, 137 and 260 ms after the first) where with no proxy they came 20 ms apart, and a request whose record came late was not held like the others. A connection for each query, closed after its answer, brings them within 13 ms of each other both ways, as one HTTP/2 connection does"
    rationale: >-
      An origin sees which connections arrive, not only which one carries the
      request: a TCP connection beside every QUIC one, or a request over
      HTTP/2 to an origin whose record says h3, is what a Firefox at the
      proxy's exit does only when QUIC is slow there. The timers measure the
      origin's QUIC against a head start, so behind a relay they wait for
      what the proxy added: the time the relay took to set up, and one round
      trip to the proxy, measured on the UDP ASSOCIATE request. A request
      held behind a page's blocking ones has no connection when its timer
      runs out, so it waits for what the proxy cost those: their relay's
      setup and two round trips, a handshake and a response. Let go by
      then, as it would be at the exit, it waits for its own relay. Still
      held, it starts TCP as it does at the exit, and what is left to match
      is the race that TCP connection runs against a QUIC connection not yet
      asked for: with proxy_optimistic_data TCP crosses the proxy one round
      trip sooner than QUIC, so the request is taken from QUIC that much
      after the backup is ready. Do not start the TCP connection later
      instead: a request that joins another's QUIC connection would never
      open it, and the origin counts connections. Do not turn
      the timers off behind a proxy, and do not lengthen them by a constant:
      an origin with no working QUIC must still be reached over TCP, as late
      as the exit would reach it and no later than the proxy makes it. A
      QUIC connection given up before its relay is ready sends nothing; its
      only datagram would announce the close of a connection the origin never
      saw. The speculative connection of a proxied request is keyed as the
      request's is, without a partition key. What is not matched: timers
      inside QUIC and TLS run on the whole path's round trip, so an origin
      that rejects ECH, whose QUIC connection takes three probe timeouts to
      close, is still raced over TCP sooner than at the exit
      (docs/proxy-dns.md).

  - id: connections-are-raced-as-release-races-them
    title: Happy Eyeballs v3 is on as in release Firefox, and behind a SOCKS5 proxy given addresses it runs on the exit's clock
    check: manual   # browser/tests/playwright/patches/ublock-connections-socks5.py, http3-https-record-socks5.py
    evidence:
      - "Nimbus rollout happy-eyeballs-release-rollout: 100% of release profiles from Firefox 157, since 2026-09-28, sets network.http.happy_eyeballs_enabled and nothing else (checked 2026-11-23). Camoufox's update channel is 'default', which no rollout targets, and a stock Firefox launched with Nimbus off runs without it too"
      - "a page whose stylesheet, image, video, font, EventSource and fetch are at six names of one site and which has a <link rel=preconnect> to a seventh, uBlock Origin 1.75.4 loaded, no proxy, 2026-11-23. Stock Firefox 160.0.1 with the pref on and Camoufox with it on, 2 or 3 runs each at 4, 40 and 100 ms: the same connections at each distance (no TCP connection at 4 and 40 ms; at 100 ms a TCP ClientHello for each of the six names and no request over TCP; every request over HTTP/3). With the pref off both made a TCP connection for five names at 40 ms and carried the EventSource, fetch and font over TCP at 100 ms"
      - "the preconnected name with uBlock Origin's network.http.speculative-parallel-limit 0: asked for A, AAAA and HTTPS with the pref off, asked nothing with it on (nsHttpHandler::SpeculativeConnectInternal: the Happy Eyeballs path returns before any lookup when the limit allows no connection). Seen from a name's authoritative server, Camoufox resolved the name and stock with uBlock Origin never did"
      - "Firefox 160, nsHttpChannel.cpp and AlternateServices.cpp: Happy Eyeballs is skipped for any channel with a proxy. third_party/rust/happy-eyeballs: the next endpoint is attempted when the newest attempt is 50 ms old (connection_attempt_delay, doubled per attempt in progress), and the rest are cancelled when one connects"
      - "behind a SOCKS5 proxy 50 ms away each way, the race on the browser's clock: a site 100 ms away saw no TCP connection where it sees six with no proxy (the TCP attempts were closed before they crossed the proxy), and an origin deaf to QUIC saw two TCP connections where it sees one (the second was started while the first was still in its SOCKS handshake)"
      - "with the proxy's cost of the attempts in progress taken off the race's clock and added to a loser's close: ublock-connections-socks5.py 5 of 8 checks before the change and 8 of 8 after; http3-https-record-socks5.py 7 of 7"
      - "third_party/rust/happy-eyeballs: once an address is known the HTTPS record is waited for 25 ms (resolution_delay). uBlock Origin resolves each request's name (browser.dns.resolve) and holds the request until it has, so in the launch's own context the race's A and AAAA queries are answered from the cache at once and the HTTPS query alone goes to the resolver. With no proxy the record is back inside the 25 ms; behind a SOCKS5 proxy it is a round trip to the proxy later, the wait ran out, and TCP was tried at the URL's port with no record: the origin got nearly every subresource request over TCP, with a GREASE ECH extension, where stock sends every one over HTTP/3 (2026-11-23)"
      - "the guard did not see it: its page was opened in a new context, whose lookups are cached apart from the extension's, so all three queries crossed the proxy together; and its resolver gave each query a connection of its own, four round trips to the proxy where a DoH resolver's one HTTP/2 connection costs one. With the page in the launch's context and the resolver on HTTP/2: 6 of 8 checks before the change (every request over TCP behind the proxy, at 4 and at 100 ms), 8 of 8 after"
      - "that wait was first lengthened by a round trip to the proxy, measured on the SOCKS5 greeting. A proxy whose endpoint runs on the browser's machine and forwards to its exit answers the greeting at once, so the round trip measured was nothing; and a DoH answer takes more than a round trip to the proxy, the resolver's own time being on top. Behind such a proxy every request still went over TCP to the URL's port, the page's own included, where stock sends every one over HTTP/3"
      - "stock Firefox 160.0.1 with uBlock Origin, no proxy, a public DoH resolver, one page load: no connection race started a connection before its HTTPS answer had come, and every answer came within the 25 ms"
      - "Firefox 160, netwerk/dns/TRR.cpp, ReturnData: every DoH answer has the time between its request and the end of its response (trrFetchDurationNetworkOnly), on a connection that is already open. RFC 6298 section 2: an answer is late after the smoothed time plus four times its variation"
      - "the guard did not see it: its proxy answered the greeting from 50 ms away, and its HTTPS records named the URL's port, where a request without its record still found HTTP/1.1. With the greeting answered at once, the records (alpn h3,h2) naming another port and the page among the site's names, 2026-11-23: 6 of 8 checks before the change (behind the proxy every request, the page's first, over TCP to the URL's port, and at 100 ms seven QUIC connections that carried nothing), 8 of 8 after in 5 of 5 runs; stock Firefox 160.0.1 and Camoufox with no proxy see the same connections on it, 2 of 2 runs each at 4 and 100 ms"
      - "the HTTPS record guard with the greeting answered at once, before and after the change: an origin deaf to QUIC sees two TCP connections behind the proxy and one with none (5 of 7 checks), because a TCP attempt's cost is measured on the greeting"
      - "the clock first gave back time it had counted as lost when fast DoH answers lowered the timeout mid-lookup. Behind a remote SOCKS5 exit, 2026-11-25: 115 of 305 races saw it jump ahead (median 41 ms, at most 169 ms), 18 of them followed by a TCP connection beside a QUIC attempt still waiting; none once the lost time is kept"
      - "the HTTPS record guard holding a QUIC association while a burst of fast answers lowers the timeout, run alternately on an idle machine, same day: 9 of 10 checks before the change in 5 of 5 runs (a TCP connection started before the association), 10 of 10 after in 5 of 5"
      - "the same exit against stock Firefox, uBlock Origin loaded, three launch variants three times each: 44 differing keys in the races' requests, QUIC and TCP connections before the change, 34, 34 and 18 in three runs after; an exit that resolves names, both builds side by side: 664 differing keys before, 624 after (TCP 52 to 32)"
    rationale: >-
      Which connections an origin sees, and which names a resolver is asked,
      are decided by the connection race, and release Firefox races with
      Happy Eyeballs v3. Without the rollout's pref Camoufox raced as no
      release profile does, with or without a proxy. Firefox turns the race
      off behind every proxy, where the proxy resolves the name and there is
      nothing to race; a SOCKS5 proxy given addresses (proxy_dns 'doh')
      connects as no proxy does, so the race stays on, as the HTTPS record
      and HTTP/3 do. Its delays are measured against attempts that reach the
      origin late by what the proxy costs: the association or the SOCKS
      handshake, and the round trips to the proxy. The race's clock is set
      back by that cost while an attempt is in progress, and an attempt that
      lost is closed that much later. A lookup crosses the proxy as well,
      and a Firefox at the exit has its resolver beside it: an answer in
      flight through the proxy must not be what lets TCP start ahead. So
      the clock stands still while an answer is outstanding, for at most
      the time after which the resolver's answers are late: RFC 6298's
      timeout over the answer times measured on the DoH requests
      themselves, the smoothed time plus four times its variation
      (TRRService::AnswerTimeout). Time the clock has stood still is kept
      when that timeout falls while an answer is outstanding: given back,
      it moves the clock ahead at once and starts TCP beside an attempt
      still in progress. An answer that is lost, or slower than
      that, is given up as stock gives it up, 25 ms later, and the request
      goes over TCP without its record. Do not bound that wait by a round
      trip to the proxy, and do not measure anything on the SOCKS greeting
      for it: the endpoint that answers the greeting may be on the
      browser's machine, and an answer costs the resolver's time as well.
      Do not wait for the answer without a bound either: an origin whose
      record never comes must still be reached. Do not
      lengthen the delays by a constant, and do not turn the race off behind the proxy: both change
      what the origin sees with the proxy's distance. A proxy given names
      still runs no race and asks no resolver. What is not matched: an
      attempt's cost is measured on the handshake with the proxy, so a
      proxy whose latency changes after it is charged the old figure, and
      a TCP attempt behind an endpoint on the browser's machine is charged
      nothing (an origin deaf to QUIC sees a second TCP connection); a
      lost HTTPS answer is given up later than at the exit, by that
      timeout.

  - id: optimistic-data-is-opt-in-and-tls-only
    title: A TLS ClientHello may travel behind the SOCKS5 CONNECT request, only when the launch asks for it
    check: manual   # browser/tests/playwright/patches/socks5-optimistic-data.py, python/tests/test_proxy_dns.py
    evidence:
      - "an origin timing the gap between the TCP handshake's last ACK and the ClientHello: 0.4 to 1.5 ms from a Firefox with no proxy, 37 to 70 ms behind a SOCKS5 proxy, which is the round trip between the exit and the browser that the proxy's reply and the ClientHello make"
      - "Firefox 160, netwerk/socket/nsSOCKSIOLayer.cpp: connectcontinue returns PR_SUCCESS only in SOCKS_CONNECTED, after ReadV5ConnectResponseBottom, and poll reports nothing but the handshake's own flags until then, so nsSocketTransport stays in STATE_CONNECTING and NSS, the layer above, cannot write"
      - "socks5-optimistic-data.py on Firefox 160.0.1, 2026-11-22, a proxy that holds its reply until it has a whole ClientHello or 3 seconds pass: with the option every TLS connection's ClientHello (1869 bytes to an address, 1900 to a name, 2392 and 2455 when resuming) is at the proxy and at the origin before the reply, a speculative connection's included; without it no connection sends a byte before the reply; the ClientHello's size and extension list are equal either way; a plain HTTP connection sends nothing early; 20 of 20 checks"
      - "the same guard on a build without the patch (Firefox 159, the pref set and unknown): no connection sends a byte before the reply, 10 of 20 checks pass"
      - "a CONNECT refused when the proxy's hold is over (Firefox 160.0.1, 2026-11-26): NS_ERROR_CONNECTION_REFUSED with and without; to an address one navigation asks twice either way, its request taking one of the two speculative connections; to a name 5 times without the option and 2 or 3 with it, because a connection still waiting for the reply opens a backup after network.http.connection-retry-timeout, and with the option none is waiting. Refused at once, both speculative connections can fail before the request is dispatched, which then opens a third, with the option or without (10 launches: 3 asks in 4 with it, in 8 without), so the count of a quick refusal is a race, not the option's"
      - "a proxy that discards the early bytes and then replies: with network.http.tls-handshake-timeout at Firefox's 30 seconds the navigation had not failed after 200 seconds and 6 CONNECTs; at 5 seconds it failed with NS_ERROR_NET_TIMEOUT after 25 seconds, or had not after 30, with 2; a navigation with no proxy to an origin that never answers a ClientHello had not failed after 60 seconds and 2 connections (before the speculative connection was keyed as the request's, the proxied one failed after 17 seconds)"
      - "RFC 1928 section 6 says nothing of bytes that follow a request before its reply; a proxy that reads the request and then pipes forwards them, one that reads through a buffer it drops, or answers from a different process than the one that pipes, loses them, and the browser cannot tell a lost ClientHello from a slow server"
    rationale: >-
      The gap is on every TLS connection and no page script is needed to see
      it, so it is worth closing, and it can only be closed by sending the
      ClientHello before the proxy has said the destination is connected. That
      is safe only when every hop forwards those bytes: one that discards them
      answers the CONNECT and leaves every handshake waiting for a ServerHello
      until network.http.tls-handshake-timeout, again and again. So it is a launch option, off
      by default (proxy_optimistic_data, network.proxy.socks5_optimistic_data).
      Do not turn it on by default, and do not add a retry without it: the
      retry is a second connection the origin sees, later than the first by a
      fixed timeout. Only a TLS layer's first flight goes ahead, because a
      ClientHello waits for an answer whatever happened to it; a plain HTTP
      request sent ahead of a refusal would be a request the browser believes
      it made. The reply stays the SOCKS layer's to read, and a refusal is
      reported with the error it has while connecting (docs/proxy-dns.md).
