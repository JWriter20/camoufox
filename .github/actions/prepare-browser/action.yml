name: Prepare browser
description: >-
  Check out the repo, install Python and the runtime libraries Firefox needs,
  and unpack the built Camoufox from the build job's artifact. Every job that
  drives a browser starts with this, so there is one place to fix when the
  runtime dependency list drifts.

inputs:
  ref:
    description: Commit to check out
    required: false
    default: ""
  python-version:
    required: false
    default: "3.12"

outputs:
  binary:
    description: Absolute path to camoufox-bin
    value: ${{ steps.unpack.outputs.binary }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - shell: bash
      run: pip install -r ci/requirements.txt

    - name: Install browser runtime libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        # What a Firefox binary needs to actually start on a bare runner. Xvfb
        # because every browser job runs headless-with-a-display rather than
        # headless-mode: see ci/tribal/rules.yml on why.
        sudo apt-get install -y --no-install-recommends \
          xvfb libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 \
          libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 \
          libxi6 libxrandr2 libxtst6 libpci3 zstd

    - uses: actions/download-artifact@v4
      with:
        name: camoufox-dist
        path: ${{ github.workspace }}

    - name: Unpack
      id: unpack
      shell: bash
      run: |
        mkdir -p .ci-browser
        zstd -d -c camoufox-dist.tar.zst | tar -C .ci-browser -xf -
        binary="$(realpath .ci-browser/bin/camoufox-bin)"
        test -x "$binary" || { echo "::error::camoufox-bin missing from the artifact"; exit 1; }
        echo "binary=$binary" >> "$GITHUB_OUTPUT"
        # Consumed by every runner via ci/_pytest.py::built_binary().
        echo "CAMOUFOX_BINARY=$binary" >> "$GITHUB_ENV"
        "$binary" --version || true
