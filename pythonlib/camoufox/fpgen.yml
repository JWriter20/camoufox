# Mappings of fpgen fingerprints to Camoufox config properties.
#
# fpgen (scrapfly/fingerprint-generator) replaced BrowserForge/Apify as the
# generator. The field set below is the one BrowserForge used to supply -- the
# rest of what fpgen carries (fonts, voices, WebGL parameters, system styles,
# permissions, RTC capabilities, audio) is NOT mapped here yet; Camoufox still
# draws those from its own catalogues. Wiring those through is the follow-up.
#
# Shape differences from browserforge.yml:
#   - window geometry is its own `window` node, not part of `screen`
#   - header values are lists
#   - there is no extraProperties.globalPrivacyControl; GPC is a pref Camoufox
#     owns (see utils.launch_options), so nothing maps to it
#   - doNotTrack is deliberately NOT mapped: Camoufox sets DNT from its own
#     config, and a drawn value is stripped unless the caller asked for one

navigator:
  # fpgen's UAs trail the current release; the version is rewritten to the
  # Camoufox Firefox version in _cast_to_properties.
  userAgent: navigator.userAgent
  appCodeName: navigator.appCodeName
  appName: navigator.appName
  appVersion: navigator.appVersion
  oscpu: navigator.oscpu
  platform: navigator.platform
  hardwareConcurrency: navigator.hardwareConcurrency
  product: navigator.product
  # Never override productSub (#105)
  # deviceMemory is not in Firefox, and fpgen reports the string "undefined"
  # Locale is handled separately (locale:*)
  maxTouchPoints: navigator.maxTouchPoints

screen:
  availLeft: screen.availLeft
  availTop: screen.availTop
  availWidth: screen.availWidth
  availHeight: screen.availHeight
  height: screen.height
  width: screen.width
  colorDepth: screen.colorDepth
  pixelDepth: screen.pixelDepth

window:
  outerHeight: window.outerHeight
  outerWidth: window.outerWidth
  innerHeight: window.innerHeight
  innerWidth: window.innerWidth
  screenX: window.screenX
  screenY: window.screenY
  pageYOffset: screen.pageYOffset
  # devicePixelRatio is not mapped: any value but 1 is a spoofing tell unless
  # the whole geometry is scaled with it.

headers:
  # accept-language is redundant with locale:*, user-agent with navigator.userAgent
  accept-encoding: headers.Accept-Encoding
